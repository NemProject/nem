type: object
description: |
  An audit collection consists of two arrays, containing information
  about incoming requests from other nodes. The first array contains
  information about outstanding (not yet processed) requests and the
  second array contains information about the most recent requests.
  The audit collection is intended for debug purposes.
required:
  - outstanding
  - most-recent
properties:
  outstanding:
    type: array
    description: Outstanding (not yet processed) audit entries.
    items:
      $ref: "./ConnectionAuditEntry.yml"
  most-recent:
    type: array
    description: Most recent audit entries.
    items:
      $ref: "./ConnectionAuditEntry.yml"
