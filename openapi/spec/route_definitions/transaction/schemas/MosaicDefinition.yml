type: object
description: A mosaic definition describes an asset type on the network.
required:
  - creator
  - id
  - description
  - properties
properties:
  creator:
    $ref: "../../../schemas/PublicKey.yml"
  id:
    $ref: "../../../schemas/MosaicId.yml"
  description:
    type: string
    minLength: 1
    maxLength: 512
    description: |
      Mosaic description. Must be non-empty and at most 512 characters.
  properties:
    description: Mosaic properties.
    type: array
    items:
      $ref: "./MosaicProperty.yml"
  levy:
    $ref: "./MosaicLevy.yml"
