tags:
  - Chain
summary: Return blockchain score
description: |
  Returns the current score of the blockchain.
  The higher the score, the better the chain.
  During synchronization, nodes try to obtain the best blockchain in the network.
operationId: getChainScore
responses:
  '200':
    description: Blockchain score successfully returned.
    content:
      application/json:
        schema:
          $ref: "../schemas/BlockchainScore.yml"
        examples:
          default:
            summary: Chain score in hexadecimal
            value:
              score: "18722d5a7d590deb"
  '400':
    $ref: "../../../responses/BadRequest.yml"
  '500':
    $ref: "../../../responses/ServerError.yml"
  '503':
    $ref: "../../../responses/ServiceUnavailable.yml"
