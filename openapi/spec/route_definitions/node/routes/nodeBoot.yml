tags:
  - Node
summary: Boot node
description: |
  Boots the local node and assigns an identity to it.
  Returns an error if the node has already been booted.

  ⚠️ **Security warning:** This endpoint is intended for trusted and local use only.
operationId: bootNode
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: "../schemas/BootNodeRequest.yml"
      examples:
        default:
          summary: Boot local NIS node
          value:
            metaData:
              application: "NIS"
            endpoint:
              protocol: "http"
              host: "localhost"
              port: 7890
            identity:
              private-key: "a6cbd01d04edecfaef51df9486c111abb6299c764a00206eb1d01f4587491b3f"
              name: "Alice"
responses:
  '200':
    description: Indicates that the node was successfully booted. No content is returned.
  '400':
    $ref: "../../../responses/BadRequest.yml"
  '500':
    $ref: "../../../responses/ServerError.yml"
  '503':
    $ref: "../../../responses/ServiceUnavailable.yml"