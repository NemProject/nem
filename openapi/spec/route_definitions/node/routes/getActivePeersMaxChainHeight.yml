tags:
  - Node
summary: Return maximum chain height from active peers
description: |
  Requests the blockchain height from every node in the active peer list and returns the maximum height observed.
  This endpoint is typically used to determine the highest known chain height in the active neighborhood.
operationId: getActivePeersMaxChainHeight
responses:
  '200':
    description: Maximum chain height retrieved successfully.
    content:
      application/json:
        schema:
          $ref: "../../../schemas/BlockReference.yml"
  '400':
    $ref: "../../../responses/BadRequest.yml"
  '500':
    $ref: "../../../responses/ServerError.yml"
  '503':
    $ref: "../../../responses/ServiceUnavailable.yml"