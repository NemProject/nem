tags:
  - Mosaic
summary: Return mosaic definitions owned by multiple accounts
description: |
  Returns a list of mosaic definitions created (owned) by the specified accounts.
  The request body contains a list of account identifiers. Mosaic definitions
  are aggregated across all accounts and deduplicated in the response.
operationId: getMosaicOwnedDefinitionBatch
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        description: List of account identifiers.
        required:
          - data
        properties:
          data:
            type: array
            items:
              $ref: "../../../schemas/AccountId.yml"
      examples:
        testnet:
          value:
            data:
              - account: "TALICELCD3XPH4FFI5STGGNSNSWPOTG5E4DS2TOS"
        mainnet:
          value:
            data:
              - account: "NCHESTYVD2P6P646AMY7WSNG73PCPZDUQNSD6JAK"
responses:
  '200':
    description: Mosaic definitions successfully retrieved.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../transaction/schemas/MosaicDefinition.yml"
  '400':
    $ref: "../../../responses/BadRequest.yml"
  '404':
    $ref: "../../../responses/ResourceNotFound.yml"
  '500':
    $ref: "../../../responses/ServerError.yml"
  '503':
    $ref: "../../../responses/ServiceUnavailable.yml"