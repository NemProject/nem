type: object
description: |
  Represents the identity of a node.
  The identity is tied to a cryptographic key pair and uniquely identifies the node in the network.
required:
  - public-key
properties:
  name:
    oneOf:
      - type: string
      - type: "null"
    description: The name of the node.
    examples:
      - Alice
  public-key:
    $ref: ../../../schemas/PublicKey.yml
    description: Public key used to identify the node.
