tags:
  - Debug
summary: Return incoming connections
description: |
  Returns an audit collection of incoming connections.
  Use this information to monitor outstanding and recent incoming requests.
operationId: getDebugIncomingConnections
responses:
  '200':
    description: Audit collection of incoming connections returned successfully.
    content:
      application/json:
        schema:
          $ref: "../schemas/ConnectionAuditResult.yml"
  '400':
    $ref: "../../../responses/BadRequest.yml"
  '500':
    $ref: "../../../responses/ServerError.yml"
  '503':
    $ref: "../../../responses/ServiceUnavailable.yml"
