tags:
  - Mosaic
summary: Returns the mosaic balances owned by an account
description: |
  Returns a list of mosaics (mosaic ID and quantity) owned by the specified account address.
operationId: getMosaicOwned
parameters:
  - $ref: ../../../parameters/query/address.yml
responses:
  '200':
    description: Mosaics successfully retrieved.
    content:
      application/json:
        schema:
          type: object
          description: List of account metadata.
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: ../../../schemas/Mosaic.yml
  '400':
    $ref: ../../../responses/BadRequest.yml
  '500':
    $ref: ../../../responses/ServerError.yml
  '503':
    $ref: ../../../responses/ServiceUnavailable.yml
