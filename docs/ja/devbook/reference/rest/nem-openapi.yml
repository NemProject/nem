openapi: 3.1.0
info:
  version: 1.0.0
  title: NEM Client API Endpoints
  description: OpenAPI specification for the NEM client API.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://libertalia.nemtest.net:7890
    description: Testnet node
  - url: http://portobelo.nemmain.net:7890
    description: Mainnet node
security:
  - {}
tags:
  - name: Account
    description: |
      Account data, metadata, status, and batch operations. Endpoints return balance, importance,
      and other account state for one or more accounts, identified by address or public key.

      - **Account**: identified by an **address** (derived from public key) or by **public key**.
      - **Account status**: `UNLOCKED` or `LOCKED` for harvesting on the queried node.
      - **Delegated account**: when requesting by delegated account key, the node resolves the main account
        that delegated to the given key (used for delegated harvesting flows).

      Local-only endpoints (e.g. generation, historical batch) are restricted by configuration (`nis.additionalLocalIps`).
  - name: Block
    description: |
      Block data retrieval. Blocks are the units of the blockchain; each block contains a list of
      transactions and is signed by a harvester.

      Endpoints: last block, block at a given height, and (local-only) block or block range by height.
  - name: Chain
    description: |
      Blockchain score and height. The chain is the ordered sequence of blocks accepted by the node.

      - **Chain height**: the number of blocks in the chain (last block height).
      - **Chain score**: a numeric measure of the chain used by nodes to choose the best chain when
        multiple exist (e.g. after a network split). Higher score means a "better" chain; applications
        rarely need to interpret this value.
  - name: Debug
    description: |
      Debug and diagnostics: timers, connection audits, and time synchronization results. Intended
      for operators and troubleshooting, not for typical application logic.

      - **Timers**: periodic tasks run by the NEM client (e.g. sync, harvesting); each timer exposes
        execution count, success/failure, and last run time.
      - **Connection audits**: request traces (incoming and outgoing) with caller/destination host,
        path, and elapsed time - useful to inspect load and slow endpoints.
      - **Time synchronization**: results of the node's time sync with the network.
  - name: Harvesting
    description: |
      Harvesting is the process by which blocks are created and fees are earned on the network.

      - **Harvester**: An account participating in block harvesting.
      - **Delegated harvester**: A remote (delegated) account that harvests on behalf
        of a main account, after importance has been transferred and the remote key
        has been unlocked on a node.
      - **Unlocked account**: An account whose private key is unlocked on a node
        (via a harvesting/unlock operation) and is therefore currently eligible to harvest.
      - **Unlocked slot**: A node-level capacity unit allowing one harvester (unlocked account).
        Nodes can be configured (via `nis.unlockedLimit`) to allow only a limited number of
        unlocked accounts simultaneously.

      Node operators can further control who is allowed to harvest on a given node:
      - `nis.allowedHarvesterAddresses`: optional list of account addresses that are allowed to use
        this node for harvesting. When set, harvesting/unlock requests with other addresses are rejected.
      - `nis.additionalHarvesterPrivateKeys`: optional list of private keys that should automatically
        start harvesting on boot (subject to `nis.unlockedLimit` and other eligibility checks).
  - name: Mosaic
    description: |
      Mosaic supply, definitions, and ownership. Mosaics are custom assets on the NEM network;
      each is identified by a mosaic id (namespace + name) and has a definition and a current supply.

      - **Mosaic id**: identifier consisting of **namespace id** (e.g. `makoto.metal.coins`) and **name**
        (e.g. `nem`); together they form a human-readable mosaic identifier.
      - **Mosaic definition**: metadata (divisibility, levy, properties).
      - **Mosaic supply**: the total number of units of the mosaic that exist (or existed at a given block height).
        Expressed in the mosaic's smallest unit (same as token amounts; see divisibility in the definition).
        Set at creation via `initialSupply`; the creator can later increase or decrease it only if the definition has `supplyMutable: true`.
  - name: Namespace
    description: |
      Namespace and root namespace operations. Namespaces provide a hierarchical naming scheme for
      mosaics (e.g. `makoto.metal.coins`).

      - **Fully-qualified namespace**: the full dot-separated path (e.g. `makoto.metal.coins`), not
        just the leaf segment. Use this when querying namespace or mosaic endpoints by namespace.
      - **Root namespace**: top-level namespace (no parent); sub-namespaces are children of a root.
  - name: Node
    description: |
      Node info, peer lists, boot, shutdown, and status.

      - **Node**: a NEM node, identified by its `identity` (public key + name) and `endpoint` (host, port, protocol).
      - **Reachable node**: a node that is currently reachable and responds to node info / peer list requests. Shown in peer lists and
        used as a base set for further selection (e.g., broadcast nodes).
      - **Broadcast node** (active broadcast node): a reachable node selected by the peer network as a target for broadcasting data
        (e.g., transactions and blocks). Returned by `/node/peer-list/active`.
      - **Node status**: categorical health/status of a node, as reported by the peer network:
        - `ACTIVE`: node is reachable and the last request succeeded.
        - `BUSY`: node is reachable but returned a busy signal for the last request.
        - `INACTIVE`: node is offline or unreachable.
        - `FAILURE`: node is reachable but the last request failed with a server error.
        - `UNKNOWN`: node is in an unknown state (no reliable status yet).
  - name: Time synchronization
    description: |
      Network time and communication timestamps. NEM uses a fixed **network epoch** (29 March 2015,
      00:06:25 UTC); timestamps are expressed in seconds or milliseconds since that epoch.
  - name: Transaction
    description: |
      Transaction retrieval, announcement, and preparation. Transactions are signed by the sender and
      broadcast to the network.

      - **Transaction hash**: unique identifier of a transaction; lookup by hash requires the
        `TRANSACTION_HASH_LOOKUP` node feature and is subject to `nis.transactionHashRetentionTime`.
      - **Unconfirmed transaction**: a transaction that has been broadcast but not yet included in any block.
      - **Confirmed transaction**: a transaction that has been included in a block. Endpoints in this tag
        return only confirmed transactions unless the endpoint name explicitly indicates otherwise (e.g. unconfirmed list).
      Local (trusted) endpoints may return full transaction data; public ones may omit sensitive fields.
externalDocs:
  description: NEM technical documentation
  url: https://nemproject.github.io/
paths:
  /account/generate:
    get:
      tags:
        - Account
      summary: Generate new account data
      description: |
        Generates a new random account key pair and returns the private key, public key, and address.
        Key pairs can also be generated client-side using an SDK (e.g. [JavaScript](https://www.npmjs.com/package/symbol-sdk), 
        [Python](https://pypi.org/project/symbol-sdk-python/)), without calling this endpoint.

        **How the account is generated:** The key pair is generated using the Ed25519 curve. The private key is 32 random bytes 
        produced by the JVM's `java.security.SecureRandom` (a cryptographically secure pseudorandom number generator). 
        The public key is derived from the private key. No custom or weak RNG is used.

        **Security:** For typical use (wallets, client applications), this is considered secure: `SecureRandom` is backed by
        the operating system's entropy source (e.g. `/dev/urandom` on Linux) and is appropriate for key generation. 
        If the system has low entropy (e.g. fresh VM, embedded device with no good entropy source), the output could theoretically be weaker;
        the NEM client relies entirely on the JVM and OS for randomness quality and does not perform additional entropy checks or seeding.

        ⚠️ **Local-only**: this endpoint returns sensitive cryptographic material and therefore is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: generateAccount
      responses:
        '200':
          description: Account successfully generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedAccount'
              examples:
                default:
                  summary: New key pair and address
                  value:
                    privateKey: 0962c6505d02123c40e858ff8ef21e2b7b5466be12c4770e3bf557aae828390f
                    address: NCKMNCU3STBWBR7E3XD2LR7WSIXF5IVJIDBHBZQT
                    publicKey: c2e19751291d01140e62ece9ee3923120766c6302e1099b04014fe1009bc89d3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/get:
    get:
      tags:
        - Account
      summary: Request account data
      description: |
        Retrieves account data for a given address.
        The response contains both account information and additional metadata such as harvesting and multisig state.
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: Account information successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMetaDataPair'
              examples:
                testnet:
                  summary: Testnet account with metadata
                  value:
                    account:
                      address: TALICELCD3XPH4FFI5STGGNSNSWPOTG5E4DS2TOS
                      balance: 124446551689680
                      vestedBalance: 104443451691625
                      importance: 0.010263666447108395
                      publicKey: a11a1a6c17a24252e674d151713cdf51991ad101751e4af02a20c61b59f1fe1a
                      label: null
                      harvestedBlocks: 645
                      multisigInfo: {}
                    meta:
                      cosignatoryOf: []
                      cosignatories: []
                      status: LOCKED
                      remoteStatus: ACTIVE
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/get/forwarded:
    get:
      tags:
        - Account
      summary: Request original account data for delegated account
      description: |
        Given the address of a delegated account, returns the account data of the
        original account for which the given address is acting as a delegate.

        If the provided address belongs to a delegated account, the response
        contains the original account’s information.

        If the provided address does not belong to a delegated account, the response
        contains the account information for the given address itself.
      operationId: getAccountByForwardedAddress
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: Account information successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMetaDataPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/get/from-public-key:
    get:
      tags:
        - Account
      summary: Request account data by public key
      description: |
        Retrieves account data given the account's public key.
        The response contains both account information and additional metadata such as harvesting and multisig state.
      operationId: getAccountByPublicKey
      parameters:
        - $ref: '#/components/parameters/publicKey'
      responses:
        '200':
          description: Account information successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMetaDataPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/get/forwarded/from-public-key:
    get:
      tags:
        - Account
      summary: Request original account data by delegated account public key
      description: |
        Given the public key of a delegated account, returns the account data of the
        original account for which the given public key is acting as a delegate.

        If the provided public key belongs to a delegated account, the response
        contains the original account’s information.

        If the provided public key does not belong to a delegated account, the response
        contains the account information for the given public key itself.
      operationId: getAccountByForwardedPublicKey
      parameters:
        - $ref: '#/components/parameters/publicKey'
      responses:
        '200':
          description: Account information successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMetaDataPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/status:
    get:
      tags:
        - Account
      summary: Request account status
      description: |
        Retrieves only the account metadata for a given address: harvesting status, delegated harvesting status, and multisig relationships (cosignatories).
        It does **not** return account info such as balance, importance, or public key.
      operationId: getAccountStatus
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: Account metadata successfully fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMetaData'
              examples:
                default:
                  summary: Account harvesting and multisig metadata
                  value:
                    cosignatories: []
                    cosignatoryOf: []
                    status: LOCKED
                    remoteStatus: ACTIVE
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/get/batch:
    post:
      tags:
        - Account
      summary: Request account data for multiple accounts
      description: |
        Retrieves a list of account data objects for multiple accounts.

        The request body contains a list of account identifiers.
      operationId: getAccountsBatch
      requestBody:
        $ref: '#/components/requestBodies/accounts'
      responses:
        '200':
          description: Successfully fetched list of account data.
          content:
            application/json:
              schema:
                type: object
                description: List of account data.
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountMetaDataPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/historical/get:
    get:
      tags:
        - Account
      summary: Retrieve historical account data
      description: |
        Retrieves historical balance and importance information for an account.

        ⚠️ This endpoint is available **only if the node supports** the optional feature `HISTORICAL_ACCOUNT_DATA`.

        **Checking if a node supports this feature:** Call GET `/node/extended-info` (or GET `/node/info`). 
        The response includes node metadata with a `features` bitmask. Historical account data corresponds to flag `0x2`; 
        the node supports this endpoint if that bit is set.

        **Enabling the feature on your own node:** In the NEM client configuration file, set `nis.optionalFeatures` to include `HISTORICAL_ACCOUNT_DATA`.
        For example: `nis.optionalFeatures = TRANSACTION_HASH_LOOKUP|HISTORICAL_ACCOUNT_DATA`.

        The request returns historical data points between the given block heights (inclusive).
        Each returned data point is a snapshot of the account state at that specific block height.
        This can be used to track changes in an account's balance or importance score over time.
        Use `increment=1` for detailed block-by-block analysis, or a larger value (e.g. `increment=1440` for roughly daily samples)
        to observe long-term trends over a wider block range.

        **Number of data points:** You control this via `startHeight`, `endHeight`, and `increment`. 
        The number of points returned is: **`(endHeight − startHeight) ÷ increment + 1`**. 
        For example, `startHeight=100`, `endHeight=199`, `increment=1` gives 100 points; the same range with `increment=10` gives 10 points. 
        This value must not exceed **10,000**; otherwise the request fails with an error (400 Bad Request). 
        To stay under the limit, use a larger `increment` and/or a smaller height range.
      operationId: getAccountHistoricalData
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/startHeight'
        - $ref: '#/components/parameters/endHeight'
        - $ref: '#/components/parameters/increment'
      responses:
        '200':
          description: Successfully retrieved historical account data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHistoricalDataList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/historical/get/batch:
    post:
      tags:
        - Account
      summary: Retrieve historical account data for multiple accounts
      description: |
        Retrieves historical balance and importance information for a collection of accounts.

        ⚠️ This endpoint is available **only if the node supports** the optional feature `HISTORICAL_ACCOUNT_DATA`.

        **Checking if a node supports this feature:** Call GET `/node/extended-info` (or GET `/node/info`). 
        The response includes node metadata with a `features` bitmask. Historical account data corresponds to flag `0x2`; 
        the node supports this endpoint if that bit is set.

        **Enabling the feature on your own node:** In the NEM client configuration file, set `nis.optionalFeatures` to include `HISTORICAL_ACCOUNT_DATA`.
        For example: `nis.optionalFeatures = TRANSACTION_HASH_LOOKUP|HISTORICAL_ACCOUNT_DATA`.

        The request returns historical data points for each requested account between the given block heights (inclusive).
        Each returned data point is a snapshot of the account state at that specific block height.
        This can be used to track changes in an account's balance or importance score over time.
        Use `incrementBy=1` for detailed block-by-block analysis, or a larger value (e.g. `incrementBy=1440` for roughly daily samples)
        to observe long-term trends over a wider block range.
        If any of the provided addresses is invalid, the entire request fails with 400 Bad Request; no partial results are returned.

        **Number of data points:** You control this via `startHeight`, `endHeight`, `incrementBy`, and the number of accounts. 
        Points per account = **`(endHeight − startHeight) ÷ incrementBy + 1`**. 
        Total points = **points per account × number of accounts**. 
        This total must not exceed **10,000**; otherwise the request fails with an error (400 Bad Request). 
        To stay under the limit, reduce the height range, increase `incrementBy`, and/or request fewer accounts.
      operationId: getAccountHistoricalDataBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accounts
                - startHeight
                - endHeight
                - incrementBy
              properties:
                accounts:
                  type: array
                  minItems: 1
                  description: List of account addresses. All must be valid; if any is invalid, the request fails with 400 Bad Request.
                  items:
                    $ref: '#/components/schemas/AccountId'
                startHeight:
                  $ref: '#/components/schemas/BlockHeight'
                  description: Block height from which the data should be supplied.
                endHeight:
                  $ref: '#/components/schemas/BlockHeight'
                  description: Block height up to which the data should be supplied (inclusive).
                incrementBy:
                  type: integer
                  format: int64
                  minimum: 1
                  description: |
                    Step between consecutive block heights. Must be greater than 0.
                    Each returned data point is a snapshot of the account state at that specific block height;
                    blocks between sampled heights are simply skipped.
                  examples:
                    - 1
            examples:
              default:
                value:
                  accounts:
                    - account: NALICELGU3IVY4DPJKHYLSSVYFFWYS5QPLYEZDJJ
                    - account: NDZQI4MPLUCFVWQY5P6LD5LFLH2NVDYOQ347DATW
                  startHeight: 17590
                  endHeight: 17592
                  incrementBy: 1
      responses:
        '200':
          description: Successfully retrieved historical account data for all requested accounts.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountHistoricalDataList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /block/at/public:
    post:
      tags:
        - Block
      summary: Return block by height
      description: |
        Returns the block at the given block height.
        The request body must contain a BlockHeight object.

        Returns an error if the block with the specified height cannot be found in the database.
      operationId: getBlockAtHeight
      requestBody:
        $ref: '#/components/requestBodies/blockHeight'
      responses:
        '200':
          description: Block successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /local/block/at:
    post:
      tags:
        - Block
      summary: Return extended block data by height
      description: |
        Returns detailed information about a block at the given block height.
        The response includes the block, its hash, difficulty, and a list of transactions with their hashes.

        ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: getLocalBlockAtHeight
      requestBody:
        $ref: '#/components/requestBodies/blockHeight'
      responses:
        '200':
          description: Extended block data successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedBlock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /local/chain/blocks-after:
    post:
      tags:
        - Block
      summary: Return blocks after block height
      description: |
        Returns up to 10 blocks from the blockchain that come after the given block height.
        The returned list does not include the block at the specified (starting) height.
        If the database contains fewer than 10 blocks after the specified height, all available blocks are returned.

        ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: getLocalBlocksAfterHeight
      requestBody:
        $ref: '#/components/requestBodies/blockHeight'
      responses:
        '200':
          description: List of extended blocks data successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedBlockList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /chain/last-block:
    get:
      tags:
        - Block
      summary: Return last block of the blockchain
      description: Returns the current last block of the blockchain.
      operationId: getLastBlock
      responses:
        '200':
          description: The latest block on the chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
              examples:
                mainnetLastBlock:
                  summary: Example last block (main network)
                  value:
                    timeStamp: 9232968
                    signature: 0a1351ef3e9b19c601e804a6d329c9ade662051d1da2c12c3aec9934353e421c79de7d8e59b127a8ca9b9d764e3ca67daefcf1952f71bc36f747c8a738036b05
                    prevBlockHash:
                      data: 58efa578aea719b644e8d7c731852bb26d8505257e03a897c8102e8c894a99d6
                      type: 1
                    transactions: []
                    version: 1744830465
                    signer: 2afca04d2cb8d16cf3656274bc55b95e60be823cfb7230d82f791ed42a309ee7
                    height: 42804
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /chain/score:
    get:
      tags:
        - Chain
      summary: Return blockchain score
      description: |
        Returns the current score of the blockchain. The higher the score, the better the chain.

        Normally there is only one chain shared by all nodes. When the network splits (e.g. connectivity issues),
        different chains can temporarily exist. Nodes then use the chain score to choose among the chains they are
        aware of until the network rejoins. Applications are typically not concerned with this value; it is mainly
        used by the node for synchronization and chain selection.
      operationId: getChainScore
      responses:
        '200':
          description: Blockchain score successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockchainScore'
              examples:
                default:
                  summary: Chain score (integer value in hexadecimal)
                  value:
                    score: 18722d5a7d590deb
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /chain/height:
    get:
      tags:
        - Chain
      summary: Return blockchain height
      description: |
        Returns the current height of the blockchain.
        The response contains the height of the last block in the chain.
      operationId: getChainHeight
      responses:
        '200':
          description: Blockchain height successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockReference'
              examples:
                default:
                  summary: Current chain height
                  value:
                    height: 42799
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /debug/timers:
    get:
      tags:
        - Debug
      summary: Return debug timers
      description: |
        Returns an array of task monitor structures for monitoring statistics of periodic tasks.
      operationId: getDebugTimers
      responses:
        '200':
          description: Debug timers returned successfully.
          content:
            application/json:
              schema:
                type: array
                description: Array of debug timer entries.
                items:
                  $ref: '#/components/schemas/TimerInformation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /debug/connections/incoming:
    get:
      tags:
        - Debug
      summary: Return incoming connections
      description: |
        Returns a request audit of HTTP requests that other clients or nodes have sent to this node's REST API.

        For each request the node records the caller's host (IP), the API path (e.g. `/chain/score`, `/node/info`), start time, and elapsed time. The response has two lists: **outstanding** (requests currently in progress) and **most-recent** (a sliding window of the latest requests). So you can see who is calling the node, which endpoints are hit, and how long requests take—useful for debugging connectivity, load, or slow endpoints.
        The node records each incoming request and exposes this trace via the API. It is a request log/trace for inspection, not a security or compliance audit. What is special is that you get a live view of in-flight requests and a short history of recent ones without parsing server logs.
      operationId: getDebugIncomingConnections
      responses:
        '200':
          description: Audit collection of incoming connections returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionAuditResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /debug/connections/outgoing:
    get:
      tags:
        - Debug
      summary: Return outgoing connections
      description: |
        Returns an audit collection of outgoing connections.
        Use this information to monitor outstanding and recent outgoing requests.
      operationId: getDebugOutgoingConnections
      responses:
        '200':
          description: Audit collection of outgoing connections returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionAuditResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /debug/time-synchronization:
    get:
      tags:
        - Debug
      summary: Return time synchronization results
      description: Returns time synchronization results for monitoring changes in network time.
      operationId: getDebugTimeSynchronization
      responses:
        '200':
          description: Time synchronization results returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSynchronizationResultList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/unlock:
    post:
      tags:
        - Harvesting
      summary: Start harvesting (unlock account)
      description: |
        Starts harvesting for the specified account.
        Accounts with a vested balance of at least 10,000 XEM are eligible to harvest blocks.
        After NEM client startup, all accounts are locked by default; harvesters need to unlock their accounts again
        (start harvesting) after each NEM client restart.

        Node operators can further restrict which accounts may harvest on this node via configuration:
        - `nis.allowedHarvesterAddresses`: only these account addresses are allowed to use this node for harvesting
          (other private keys are rejected by server-side validation).
        - `nis.additionalHarvesterPrivateKeys`: additional harvester private keys that are automatically unlocked
          for harvesting on boot (subject to `nis.unlockedLimit` and standard eligibility checks).

        ⚠️ **Security warning:** For non-local network calls, the private key used in the request must always be the private key of the delegated account.
        For trusted and local network calls, it is possible, but not recommended, to use the private key of the main account.
      operationId: startHarvesting
      requestBody:
        $ref: '#/components/requestBodies/privateKey'
      responses:
        '200':
          description: Indicates success. No response body is returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/lock:
    post:
      tags:
        - Harvesting
      summary: Stop harvesting (lock account)
      description: |
        Stops harvesting for the specified account.

        ⚠️ **Security warning:** For non-local network calls, the private key used in the request must always be the private key of the delegated account.
        For trusted and local network calls, it is possible, but not recommended, to use the private key of the main account.
      operationId: stopHarvesting
      requestBody:
        $ref: '#/components/requestBodies/privateKey'
      responses:
        '200':
          description: Indicates success. No response body is returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/unlocked/info:
    post:
      tags:
        - Harvesting
      summary: Retrieve information about the harvesting capacity of this node
      description: |
        Retrieves the current and maximum number of harvesters on this node.
        Each node can be configured to allow a limited number of harvesters. These correspond to accounts unlocked for harvesting.
        The returned information reflects the current usage and the configured limit.
      operationId: retrieveUnlockedInfo
      responses:
        '200':
          description: Harvesting statistics returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestingStats'
              examples:
                default:
                  summary: Unlock capacity and current count
                  value:
                    num-unlocked: 2
                    max-unlocked: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/harvests:
    get:
      tags:
        - Harvesting
      summary: Retrieve the list of blocks harvested by an account
      description: |
        Gets an array of harvested block information objects for the specified account.

        The result contains information about blocks harvested by the account,
        starting from a given block identifier and supports pagination.
      operationId: getHarvestedBlocks
      parameters:
        - $ref: '#/components/parameters/addressFilter'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Successfully returned harvested info for the account.
          content:
            application/json:
              schema:
                type: object
                description: Array of harvest info.
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HarvestInfo'
              examples:
                default:
                  summary: Harvested blocks for account
                  value:
                    data:
                      - timeStamp: 8879051
                        difficulty: 26453656336676
                        totalFee: 102585065
                        id: 1262068
                        height: 37015
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/importances:
    get:
      tags:
        - Harvesting
      summary: Retrieve importance data for all accounts
      description: |
        Gets an array of account importance objects.

        Each entry contains an account address and its importance information.
        Importance data may be unset for accounts that are not eligible for harvesting.
      operationId: getImportanceData
      responses:
        '200':
          description: Successfully returned importance data for accounts.
          content:
            application/json:
              schema:
                type: object
                description: Array of accounts importance data.
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountImportanceData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /local/account/isunlocked:
    post:
      tags:
        - Harvesting
      summary: Check if account is harvesting
      description: |
        Checks whether the account corresponding to the given private key is currently harvesting.

        ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: fetchAccountHarvestingStatus
      requestBody:
        $ref: '#/components/requestBodies/privateKey'
      responses:
        '200':
          description: Returns whether the account is harvesting (`ok`) or not (`nope`).
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - ok
                  - nope
              examples:
                unlocked:
                  value: ok
                locked:
                  value: nope
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /mosaic/supply:
    get:
      tags:
        - Mosaic
      summary: Return mosaic supply
      description: |
        Returns the current supply for a given mosaic identifier.
        The mosaic id is provided as a request parameter and parsed by the server into a MosaicId object.
      operationId: getMosaicSupply
      parameters:
        - $ref: '#/components/parameters/mosaicId'
      responses:
        '200':
          description: Mosaic supply successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicIdSupplyPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/mosaic/owned/definition:
    get:
      tags:
        - Mosaic
      summary: Return mosaic definitions owned by an account
      description: |
        Returns a list of mosaic definitions for mosaics currently owned by the specified account.
        The account is identified by its address, which is provided as a query parameter.
      operationId: getMosaicOwnedDefinition
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: Mosaic definitions successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                description: List of account metadata.
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MosaicDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/mosaic/owned/definition/batch:
    post:
      tags:
        - Mosaic
      summary: Return mosaic definitions owned by multiple accounts
      description: |
        Returns a list of mosaic definitions for mosaics currently owned by the specified accounts.
        The request body contains a list of account identifiers. For each account, the node looks at mosaics that
        the account holds (plus XEM and first‑level levy mosaics) and collects their definitions. Mosaic definitions
        are aggregated across all accounts and deduplicated in the response.

        This is useful when you manage or query many accounts at once (for example, a service that tracks several customers' accounts) 
        and want to fetch each mosaic definition only once: even if the same mosaic is owned by multiple accounts in the request, 
        its definition appears only a single time in the response.
      operationId: getMosaicOwnedDefinitionBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: List of account identifiers.
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/AccountId'
            examples:
              testnet:
                value:
                  data:
                    - account: TALICELCD3XPH4FFI5STGGNSNSWPOTG5E4DS2TOS
              mainnet:
                value:
                  data:
                    - account: NCHESTYVD2P6P646AMY7WSNG73PCPZDUQNSD6JAK
      responses:
        '200':
          description: Mosaic definitions successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MosaicDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/mosaic/owned:
    get:
      tags:
        - Mosaic
      summary: Returns the mosaic balances owned by an account
      description: |
        Returns a list of mosaics (mosaic ID and quantity) owned by the specified account address.
      operationId: getMosaicOwned
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: Mosaics successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                description: List of account metadata.
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Mosaic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /mosaic/definition:
    get:
      tags:
        - Mosaic
      summary: Return mosaic definition
      description: |
        Returns the mosaic definition for the given mosaic identifier.

        The parent namespace of the mosaic must be **active**; otherwise the request fails with HTTP `404 Not Found`.
      operationId: getMosaicDefinition
      parameters:
        - $ref: '#/components/parameters/mosaicId'
      responses:
        '200':
          description: Mosaic definition successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /mosaic/definition/last:
    get:
      tags:
        - Mosaic
      summary: Return last known mosaic definition
      description: |
        Returns the last known mosaic definition (latest version) for the given mosaic identifier.

        Mosaic definitions can be updated over time. If multiple definitions exist for the same `mosaicId`, this endpoint always returns the
        most recent version known to the node (highest internal database id), regardless of whether the mosaic or its owning namespace has expired.

        This endpoint does not perform any height-based or expiry checks:
        it simply returns the latest stored definition. For the native XEM mosaic, a predefined static definition is returned.

        To check whether a mosaic is still active at a specific block height, use one of the following:
        - GET /local/mosaic/definition/supply with mosaicId and height to get the definition together with expirationHeight of the owning namespace;
          if height is greater than or equal to expirationHeight, the mosaic is expired at that height.
        - GET /local/mosaics/expired to list mosaics that expire at a given height (requires the `TRACK_EXPIRED_MOSAICS` feature).
      operationId: getLastMosaicDefinition
      parameters:
        - $ref: '#/components/parameters/mosaicId'
      responses:
        '200':
          description: Last mosaic definition successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MosaicDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /mosaic/definition/page:
    get:
      tags:
        - Mosaic
      summary: Return mosaic definitions (paged)
      description: |
        Returns all known mosaic definitions using pagination.
        Each entry contains a mosaic definition together with associated metadata.
      operationId: getMosaicDefinitionPage
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Mosaic definitions successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MosaicDefinitionMetaDataPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespace/mosaic/definition/page:
    get:
      tags:
        - Mosaic
      summary: Return mosaic definitions for namespace (paged)
      description: |
        Returns mosaic definitions for mosaics whose `namespaceId` matches the specified namespace exactly.
        A single namespace can define multiple mosaics (for example, `alice.drinks:beer` and `alice.drinks:juice` both belong to the
        namespace `alice.drinks`); this endpoint lists one definition for each such mosaic.
        It does not include mosaics from child namespaces (e.g., `alice.drinks.premium:*`).
        If the namespace is inactive or does not exist, the response is 200 with an empty list.
        The request supports cursor-based paging. Each returned item contains a mosaic definition and associated metadata.
      operationId: getNamespaceMosaicDefinitionPage
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Mosaic definitions successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MosaicDefinitionMetaDataPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/mosaic/definition/page:
    get:
      tags:
        - Mosaic
      summary: Returns mosaic definitions created by an account
      description: |
        Returns mosaic definitions for mosaics created by the specified account (the account is the creator of the definition).
        Results can be optionally filtered by a parent namespace and retrieved in pages using a cursor-based pagination mechanism.
      operationId: getAccountMosaicDefinitionPage
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/parentNamespace'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Mosaic definitions successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MosaicDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /local/mosaic/definition/supply:
    get:
      tags:
        - Mosaic
      summary: Return mosaic definition and supply at a given block height
      description: |
        Returns the mosaic definition along with its current supply and
        the expiration height of the owning namespace at the specified block height.
        If the mosaic does not exist at that height, an empty list is returned.

        ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: getMosaicDefinitionWithSupply
      parameters:
        - $ref: '#/components/parameters/mosaicId'
        - $ref: '#/components/parameters/height'
      responses:
        '200':
          description: Mosaic definition and supply list (empty list if not found).
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MosaicDefinitionSupplyTuple'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /local/mosaics/expired:
    get:
      tags:
        - Mosaic
      summary: List expired mosaics at a block height
      description: |
        Returns mosaics that expired or were restored at the specified block height.
        Each entry includes the mosaic id, the type of event (expired vs restored), and the balances
        held by each account at the time of expiry.

        **Requirements:**
        - The node must support the `TRACK_EXPIRED_MOSAICS` feature (see `GET /node/info`, `metaData.features`).
        - If the feature is not supported, the server returns HTTP 500 with message
          `this node does not support tracking expired mosaics`.

        If the `height` parameter is omitted, the server uses the maximum block height
        (effectively returning expirations recorded at the highest processed height).

         ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
         By default, it is available only from the machine where the REST server is running (localhost).
         You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: getMosaicExpired
      parameters:
        - $ref: '#/components/parameters/height'
      responses:
        '200':
          description: List of expired/restored mosaics at the given height (empty array if none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiredMosaicList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespace/root/page:
    get:
      tags:
        - Namespace
      summary: Retrieve root namespaces
      description: |
        Gets root namespaces in a paged manner. A **root namespace** is a namespace without a parent (e.g. `alice`); 
        sub-namespaces (e.g. `alice.vouchers`) have a parent and are not returned by this endpoint.
        Each returned item contains namespace information together with a database id used for keyset pagination.
      operationId: getRootNamespaces
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: List of root namespaces retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceMetaDataPairList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespace:
    get:
      tags:
        - Namespace
      summary: Return namespace information
      description: |
        Retrieves information about the namespace identified by the given fully-qualified name.
        A fully-qualified namespace is the **full dot-separated path** from the root namespace down to the target namespace,
        for example:
        - `alice` (root namespace)
        - `alice.drinks` (child of `alice`)
        - `alice.drinks.premium` (child of `alice.drinks`)

        The namespace must exist and be active; otherwise the request fails with HTTP `404 Not Found` (`ResourceNotFound`).
      operationId: getNamespace
      parameters:
        - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          description: Namespace information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
              examples:
                default:
                  summary: Namespace with fully-qualified name and owner
                  value:
                    fqn: makoto.metal.coins
                    owner: TD3RXTHBLK6J3UD2BH2PXSOFLPWZOTR34WCG4HXH
                    height: 13465
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/namespace/page:
    get:
      tags:
        - Namespace
      summary: Return namespaces owned by account
      description: |
        Retrieves namespaces owned by a given account address.
        If the optional parent parameter is supplied, only sub-namespaces of the given parent namespace are returned.
      operationId: getNamespaces
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/parentNamespace'
      responses:
        '200':
          description: Namespaces owned by the account retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Namespace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /node/info:
    get:
      tags:
        - Node
      summary: Return basic node information
      description: |
        Retrieves basic information about a NEM node, including its identity, endpoint configuration, and metadata.
        Using IP `127.0.0.1` retrieves information about the local node.
      operationId: getNodeInfo
      responses:
        '200':
          description: Node information successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
              examples:
                default:
                  summary: Node with identity, endpoint and metadata
                  value:
                    metaData:
                      features: 1
                      application: NIS
                      networkId: -104
                      version: 0.4.33-BETA
                      platform: Oracle Corporation (1.8.0_25) on Windows 8
                    endpoint:
                      protocol: http
                      port: 7890
                      host: 81.224.224.156
                    identity:
                      name: Alice
                      public-key: a1aaca6c17a24252e674d155713cdf55996ad00175be4af02a20c67b59f9fe8a
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /node/extended-info:
    get:
      tags:
        - Node
      summary: Return extended node information
      description: |
        Retrieves extended information about a NEM node.

        The response contains:
          - basic node information (`node`)
          - application-level metadata (`nisInfo`)
      operationId: getNodeExtendedInfo
      responses:
        '200':
          description: Extended node information successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /node/peer-list/all:
    get:
      tags:
        - Node
      summary: Return all known nodes in the neighborhood of the queried node
      description: |
        Gets a collection of all nodes currently known by the queried node, grouped by their connection status.

        The response contains arrays of nodes categorized by status:
          - `active`: node is reachable and responsive
          - `busy`: node is reachable but does not respond within timeout
          - `inactive`: node is unreachable
          - `failure`: node failed authentication or encountered a fatal error
      operationId: getAllNodePeerList
      responses:
        '200':
          description: Successfully retrieved node neighborhood.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /node/peer-list/reachable:
    get:
      tags:
        - Node
      summary: Return the list of reachable (active) nodes in the neighborhood of the queried node
      description: |
        Returns a list of all nodes currently known by the queried node that have status **ACTIVE**.
        Only nodes that are reachable and respond in a timely manner are returned.
      operationId: getReachableNodePeerList
      responses:
        '200':
          description: Successfully retrieved reachable nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /node/peer-list/active:
    get:
      tags:
        - Node
      summary: Return active broadcast nodes in neighborhood
      description: |
        Gets a list of **active nodes selected for broadcasts** in the neighborhood.

        These nodes are a subset of reachable nodes and are used by the queried node to 
        broadcast data (e.g. transactions and blocks) across the network.
      operationId: getActiveNodePeerList
      responses:
        '200':
          description: Successfully retrieved active broadcast nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /node/active-peers/max-chain-height:
    get:
      tags:
        - Node
      summary: Return maximum chain height from active peers
      description: |
        Makes the queried node request the blockchain height from every node in its active peer list, and returns the maximum height observed
        (the highest known chain height in the active neighborhood).
      operationId: getActivePeersMaxChainHeight
      responses:
        '200':
          description: Maximum chain height retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockReference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /node/boot:
    post:
      tags:
        - Node
      summary: Boot node
      description: |
        Boots the local node and assigns an identity to it.

        This endpoint is used when you do not want to store the boot private key in the NEM client configuration file.
        You start the NEM client with `nis.shouldAutoBoot = false` (and without `nis.bootKey`), then call this endpoint from a
        trusted host to provide the private key and node name at runtime.

        Boot state is **not persisted**: after restarting the NEM client process, the node must be booted again, either via
        configuration (auto-boot) or by calling this endpoint.

        If you call this endpoint when the node is already booted, the request fails with HTTP `503 Service Unavailable` and message `NIS_ILLEGAL_STATE_ALREADY_BOOTED`.

        ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: bootNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootNodeRequest'
            examples:
              default:
                summary: Boot local NEM client node
                value:
                  metaData:
                    application: NIS
                  endpoint:
                    protocol: http
                    host: localhost
                    port: 7890
                  identity:
                    private-key: a6cbd01d04edecfaef51df9486c111abb6299c764a00206eb1d01f4587491b3f
                    name: Alice
      responses:
        '200':
          description: Indicates that the node was successfully booted. No content is returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /node/experiences:
    get:
      tags:
        - Node
      summary: Return node experiences
      description: |
        Returns an array of node experiences collected by the local node (success/failure counts per peer).
        This data is used internally by the P2P layer for trust scoring and node selection. For API clients,
        the endpoint is mainly useful as a diagnostics and monitoring tool e.g. to see how the node is
        doing with its peers or to troubleshoot connectivity.
      operationId: getNodeExperiences
      responses:
        '200':
          description: Successfully retrieved node experiences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedNodeExperiencePairList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /shutdown:
    get:
      tags:
        - Node
      summary: Shut down NEM client
      description: |
        Stops the currently running NEM client instance.
        After shutdown, the node must be restarted manually. No further responses will be returned by this server until it is restarted.

        ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: nodeShutdown
      responses:
        '200':
          description: Indicates that server shutdown was initiated successfully. No response body is returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /heartbeat:
    get:
      tags:
        - Node
      summary: Return node heartbeat
      description: |
        Determines whether the node is up and responsive.
        If this request does not return a response, the node is either not running or is unable to serve requests.
      operationId: nodeHeartbeat
      responses:
        '200':
          description: Indicates that the node is responsive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHeartbeatResult'
              examples:
                ok:
                  value:
                    type: 2
                    code: 1
                    message: ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /status:
    get:
      tags:
        - Node
      summary: Return node status
      operationId: getNodeStatus
      responses:
        '200':
          description: Returns the node status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeStatusResult'
              examples:
                ok:
                  value:
                    type: 4
                    code: 3
                    message: status
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /time-sync/network-time:
    get:
      tags:
        - Time synchronization
      summary: Return current network time (communication timestamps)
      description: |
        Returns the local node's current network time as a pair of communication timestamps: `sendTimeStamp` and `receiveTimeStamp`.

        Both fields are network timestamps in **milliseconds since the NEM network epoch** (see `NetworkTimeStampMilliseconds`).
        Both `sendTimeStamp` and `receiveTimeStamp` are set to the same value (the moment when the node handled the request).
        They are structured this way to match the format used by the P2P time synchronization protocol.
      operationId: getNetworkTime
      responses:
        '200':
          description: Network communication timestamps successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationTimestamps'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/unconfirmedTransactions:
    get:
      tags:
        - Transaction
      summary: Return unconfirmed transactions for an account
      description: |
        Returns a list of unconfirmed transactions where the given account is either the sender or the recipient.
        Only the most recent 25 unconfirmed transactions are returned.
        Transactions remain in this list until they are either accepted (included in a block) or expire.
      operationId: getUnconfirmedTransactions
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        '200':
          description: Returns a list of unconfirmed transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnconfirmedTransactionMetaDataPairList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/transfers/all:
    get:
      tags:
        - Transaction
      summary: Return all transactions to or from an account
      description: |
        Gets an array of transaction metadata pairs for which the specified account is either the sender or the recipient.

        Transactions are sorted in descending order by insertion time.

        By default, up to **25** transactions are returned.
        The number of returned items can be increased up to **100** by using the `pageSize` query parameter.

        Optional pagination parameters (`hash`, `id`) allow fetching transactions that appeared directly 
        before the referenced transaction.   
        Use `id` (from `meta.id` in a previous response) for reliable pagination on any node; use `hash` (from `meta.hash`) only 
        when the node has the **transaction hash lookup (hash retention)** feature and the hash is still within 
        the retention window (`nis.transactionHashRetentionTime`), otherwise the request may fail. See the `hash` and `id` parameter descriptions for details.
      operationId: getAllAccountTransactions
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/hashFilter'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Successfully returned transaction data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionMetaDataPairList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/transfers/incoming:
    get:
      tags:
        - Transaction
      summary: Return incoming transactions for an account
      description: |
        Gets an array of transaction metadata pairs for which the specified account is the recipient of the transaction.

        Transactions are sorted in descending order by insertion time.

        By default, up to **25** transactions are returned.
        The number of returned items can be increased up to **100** by using the `pageSize` query parameter.

        Optional pagination parameters (`hash`, `id`) allow fetching transactions that appeared directly 
        before the referenced transaction.
        Use `id` (from `meta.id` in a previous response) for reliable pagination on any node; use `hash` (from `meta.hash`) only 
        when the node has the **transaction hash lookup (hash retention)** feature and the hash is still within 
        the retention window (`nis.transactionHashRetentionTime`), otherwise the request may fail. See the `hash` and `id` parameter descriptions for details.
      operationId: getIncomingAccountTransactions
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/hashFilter'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Successfully returned incoming transaction data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionMetaDataPairList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /account/transfers/outgoing:
    get:
      tags:
        - Transaction
      summary: Return outgoing transactions for an account
      description: |
        Gets an array of transaction metadata pairs for which the specified account is the sender of the transaction.

        Transactions are sorted in descending order by insertion time.

        By default, up to **25** transactions are returned.
        The number of returned items can be increased up to **100** by using the `pageSize` query parameter.

        Optional pagination parameters (`hash`, `id`) allow fetching transactions that appeared directly 
        before the referenced transaction. 
        Use `id` (from `meta.id` in a previous response) for reliable pagination on any node; use `hash` (from `meta.hash`) only 
        when the node has the **transaction hash lookup (hash retention)** feature and the hash is still within 
        the retention window (`nis.transactionHashRetentionTime`), otherwise the request may fail. See the `hash` and `id` parameter descriptions for details.
      operationId: getOutgoingAccountTransactions
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/hashFilter'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Successfully returned outgoing transaction data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionMetaDataPairList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /transaction/get:
    get:
      tags:
        - Transaction
      summary: Return transaction with specified hash
      description: |
        Returns the transaction associated with the specified transaction hash, including its metadata.

        **Retention window**

        Transactions can be looked up by hash only while the hash is in the node's in-memory cache.
        Once the retention period expires, the hash is removed and this endpoint can no longer return that transaction, even if it is already in a block.

        The cache duration is set by `nis.transactionHashRetentionTime` (in hours). Default is 36 hours.
        Minimum is 36 hours unless the value is -1 (infinite retention). There is no fixed maximum; it depends on node configuration.
        The window therefore varies by node.

        **Checking if a node supports this endpoint**

        This endpoint is only available when the node has the transaction-hash-lookup feature (`TRANSACTION_HASH_LOOKUP`) enabled.
        When it is disabled, lookup by hash is not available at all - you cannot search for a transaction by its hash on that node.
        To check: call `GET /node/info` and inspect `metaData.features`. If `(metaData.features & 0x1) !== 0`, the node supports lookup by hash.
        There is no single API that returns a list of nodes supporting this feature; you must query each node's info and test the `features` bitmask.

        Errors:
        - Unsupported feature: HTTP 500 with message like `this node does not support transaction lookup using a hash`. The node does not support this endpoint.
        - Hash not found: HTTP 400 with message `Hash was not found in cache`. The hash is not in the cache—either it never existed on this node or it has expired from the retention window. The response does not distinguish between these two cases.
      operationId: getTransactionByHash
      parameters:
        - $ref: '#/components/parameters/hash'
      responses:
        '200':
          description: Successfully returned transaction data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionMetaDataPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /local/account/transfers/all:
    post:
      tags:
        - Transaction
      summary: Return all transactions with decoded messages
      description: |
        Returns incoming and outgoing transactions for an account, including decoded transaction messages.

        This endpoint behaves like `/account/transfers/all`, but if a transaction contains an encrypted message, 
        the message is decrypted before being returned.

        Transactions are sorted in descending order by insertion time.

        ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: getLocalAllAccountTransactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPrivateKeyTransactionsPage'
      responses:
        '200':
          description: Successfully returned transaction data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionMetaDataPairList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /local/account/transfers/incoming:
    post:
      tags:
        - Transaction
      summary: Return incoming transactions for an account with decoded messages
      description: |
        Gets an array of transaction metadata pairs for which the specified account is the recipient of the transaction.
        If a transaction contains an encrypted message, the message is decrypted before being returned.

        Transactions are sorted in descending order by insertion time.

        ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: getLocalIncomingAccountTransactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPrivateKeyTransactionsPage'
      responses:
        '200':
          description: Successfully returned transaction data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionMetaDataPairList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /local/account/transfers/outgoing:
    post:
      tags:
        - Transaction
      summary: Return outgoing transactions for an account with decoded messages
      description: |
        Gets an array of transaction metadata pairs for which the specified account is the sender of the transaction.
        If a transaction contains an encrypted message, the message is decrypted before being returned.

        Transactions are sorted in descending order by insertion time.

        ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.
      operationId: getLocalOutgoingAccountTransactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPrivateKeyTransactionsPage'
      responses:
        '200':
          description: Successfully returned transaction data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionMetaDataPairList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /transaction/announce:
    post:
      tags:
        - Transaction
      summary: Announce a signed transaction
      description: |
        Broadcasts a signed transaction to the network.
        The private key is not needed. The request must contain the serialized transaction data and its corresponding signature.
        Transactions can be signed client-side using an SDK (e.g. [JavaScript](https://www.npmjs.com/package/symbol-sdk), 
        [Python](https://pypi.org/project/symbol-sdk-python/)) and then announced via this endpoint.
      operationId: announceTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnounceRequest'
      responses:
        '200':
          description: |
            Transaction accepted and announced.
            The response body is always an `AnnounceResult`; check `code` and `message` to see whether validation passed
            (code 1, message SUCCESS, or code 0, message NEUTRAL) or failed (e.g., FAILURE_INSUFFICIENT_BALANCE). 
            A non-success result means the transaction was not added to the unconfirmed cache and will not be further processed.

            The most common errors are:
              - `FAILURE_INSUFFICIENT_BALANCE`: The sender account has not enough funds.
              - `FAILURE_TIMESTAMP_TOO_FAR_IN_FUTURE`: The timestamp is invalid because it lies too far in the future.
              - `FAILURE_PAST_DEADLINE`: The deadline is invalid because it has already been passed.
              - `FAILURE_MESSAGE_TOO_LARGE`: The attached message is too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnounceResult'
              examples:
                success:
                  summary: Transaction accepted and announced
                  value:
                    type: 1
                    code: 1
                    message: SUCCESS
                    transactionHash:
                      data: c1786437336da077cd572a27710c40c378610e8d33880bcb7bdb0a42e3d35586
                    innerTransactionHash:
                      data: cc317a7674d56352b4c711096a7594bd11908bf518293a191fc2faa12eac0fbb
                validationFailureInsufficientBalance:
                  summary: Validation failed - insufficient balance
                  value:
                    type: 1
                    code: 5
                    message: FAILURE_INSUFFICIENT_BALANCE
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /transaction/prepare-announce:
    post:
      tags:
        - Transaction
      summary: Prepare and announce a transaction
      description: |
        Creates, signs, and broadcasts a transaction to the NEM network.

        ⚠️ **Local-only:** for security reasons, this endpoint is only accessible from trusted IP addresses.
        By default, it is available only from the machine where the REST server is running (localhost).
        You can allow additional trusted IP addresses by configuring the `nis.additionalLocalIps` property in the NEM client configuration file.

        This endpoint requires the sender’s private key, which the NEM client uses to sign the transaction before announcing it to the network.
      operationId: prepareAnnounceTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareAnnounceRequest'
      responses:
        '200':
          description: Transaction successfully announced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnounceResult'
              examples:
                success:
                  summary: Transaction signed and announced
                  value:
                    type: 1
                    code: 1
                    message: SUCCESS
                    transactionHash:
                      data: c1786437336da077cd572a27710c40c378610e8d33880bcb7bdb0a42e3d35586
                    innerTransactionHash:
                      data: cc317a7674d56352b4c711096a7594bd11908bf518293a191fc2faa12eac0fbb
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    PrivateKey:
      type: string
      description: 256-bit private key encoded as a hexadecimal string (64 hex characters).
      minLength: 64
      maxLength: 64
      pattern: ^[0-9a-fA-F]{64}$
      examples:
        - a04cd0fce20b0806bef448d273d47d4a15945f46716d198b506cbf1c44650f42
    PublicKey:
      type: string
      description: 256-bit public key encoded as a hexadecimal string (64 hex characters).
      minLength: 64
      maxLength: 64
      pattern: ^[0-9a-fA-F]{64}$
      examples:
        - 18e4f79f886927de698df1f857de2aada41ccca6617e56bb0d61623b35b08cc0
    Address:
      type: string
      description: |
        Represents a unique account address. The first character indicates the network (T for testnet, N for mainnet).
        Addresses are 40 characters long, Base32-encoded, and include an embedded 4-byte checksum. 
        The node validates this checksum, so an address with even a single altered character will be rejected.
      minLength: 40
      maxLength: 40
      pattern: ^[A-Z2-7]{40}$
      examples:
        - TALICELCD3XPH4FFI5STGGNSNSWPOTG5E4DS2TOS
    GeneratedAccount:
      type: object
      description: |
        An object containing information about a newly generated account.
        It includes the private key, the public key, and the derived address.
      required:
        - privateKey
        - publicKey
        - address
      properties:
        privateKey:
          $ref: '#/components/schemas/PrivateKey'
        publicKey:
          $ref: '#/components/schemas/PublicKey'
        address:
          $ref: '#/components/schemas/Address'
    NetworkTimeStamp:
      type: integer
      format: int64
      description: |
        Network timestamp in **seconds** since the NEM network epoch (29 March 2015, 00:06:25 UTC), i.e. since the creation of the nemesis (genesis) block.
        The epoch is hardcoded and **the same for all networks** (mainnet, testnet). Used in transactions, blocks, and deadlines.
        To convert to a real date: add this value (in seconds) to the Unix timestamp of the NEM epoch (1427587585 s for 29 March 2015 00:06:25 UTC), then use standard date functions.
      examples:
        - 9108808
    ModelError:
      type: object
      description: Error response returned when a request is invalid or an internal error occurs.
      required:
        - timeStamp
        - error
        - message
        - status
      properties:
        timeStamp:
          $ref: '#/components/schemas/NetworkTimeStamp'
        error:
          type: string
          description: Short error type identifier.
        message:
          type: string
          description: Detailed error message describing the failure.
        status:
          type: integer
          format: int32
          description: The HTTP status code of the response.
          examples:
            - 400
            - 404
            - 500
            - 503
            - 401
    Amount:
      type: integer
      format: int64
      description: Token amount in smallest unit (no decimals).
      minimum: 0
      examples:
        - 408676852850
    Importance:
      type: number
      format: double
      description: Account importance for harvesting, between 0 and 1 (inclusive).
      minimum: 0
      maximum: 1
      examples:
        - 0.00008857563463531297
    AccountMultisigInfo:
      type: object
      description: |
        Additional multisig account information. The value is always an object, never null.
        If the account is not a multisig account, the object is empty `{}`.
        If the account is a multisig account, the object contains `cosignatoriesCount` and `minCosignatories`.
      properties:
        cosignatoriesCount:
          type: integer
          format: int32
          description: Number of cosignatories for the multisig account.
          examples:
            - 3
        minCosignatories:
          type: integer
          format: int32
          description: Minimum number of cosignatories required to approve a transaction.
          examples:
            - 2
    AccountInfo:
      type: object
      description: Basic account information.
      required:
        - address
        - balance
        - vestedBalance
        - importance
        - harvestedBlocks
      properties:
        address:
          $ref: '#/components/schemas/Address'
        balance:
          $ref: '#/components/schemas/Amount'
          description: |
            The account's balance as a non-negative integer in micro XEM. For example, 123456789 means 123.456789 XEM.
            This is the spendable amount. When sending a transaction, the node checks that the amount does not exceed this balance.
        vestedBalance:
          $ref: '#/components/schemas/Amount'
          description: |
            Vested balance of the account in micro XEM. It indicates how much of the balance is already vested.
            Each day, 10% of the unvested balance is added to the vested balance. Used for importance calculation only; it is not used when sending a transaction.
            Only accounts with at least 10,000 XEM vested balance are eligible for importance score calculation and can activate harvesting.
        importance:
          $ref: '#/components/schemas/Importance'
        publicKey:
          oneOf:
            - $ref: '#/components/schemas/PublicKey'
            - type: 'null'
          description: Public key of the account, or null if the account has not yet published a transaction.
        label:
          oneOf:
            - type: string
            - type: 'null'
          description: Reserved; currently unused and always null.
          examples:
            - null
        harvestedBlocks:
          type: integer
          format: int64
          description: |
            Number of blocks harvested by this account (0 for new accounts). Harvesting is the process of creating new blocks.
          examples:
            - 645
        multisigInfo:
          $ref: '#/components/schemas/AccountMultisigInfo'
    AccountStatus:
      type: string
      description: |
        The harvesting status of a queried account.

        The harvesting status can be one of the following values:
        - **UNKNOWN**: The harvesting status of the account is not known.
        - **LOCKED**: The account is not harvesting.
        - **UNLOCKED**: The account is harvesting.
      enum:
        - UNKNOWN
        - LOCKED
        - UNLOCKED
    AccountRemoteStatus:
      type: string
      description: |
        The status of delegated harvesting of a queried account.

        The delegated (remote) harvesting status can be one of the following values:
        - **REMOTE**: The account is a delegated account and therefore delegated harvesting status is not applicable for it.
        - **ACTIVATING**: The account has activated delegated harvesting, but it is not yet active.
        - **ACTIVE**: The account has activated delegated harvesting and delegated harvesting is active.
        - **DEACTIVATING**: The account has deactivated delegated harvesting, but delegated harvesting is still active.
        - **INACTIVE**: The account has inactive delegated harvesting, or it has deactivated delegated harvesting and 
          deactivation is operational.
      enum:
        - REMOTE
        - ACTIVATING
        - ACTIVE
        - DEACTIVATING
        - INACTIVE
    AccountMetaData:
      type: object
      description: Additional metadata describing the account state.
      required:
        - status
        - remoteStatus
        - cosignatoryOf
        - cosignatories
      properties:
        status:
          $ref: '#/components/schemas/AccountStatus'
        remoteStatus:
          $ref: '#/components/schemas/AccountRemoteStatus'
        cosignatoryOf:
          type: array
          description: Accounts for which this account is a cosignatory.
          items:
            $ref: '#/components/schemas/AccountInfo'
        cosignatories:
          type: array
          description: Accounts that are cosignatories of this account.
          items:
            $ref: '#/components/schemas/AccountInfo'
    AccountMetaDataPair:
      type: object
      description: |
        Object includes information for an account and additional information about its state.
      required:
        - account
        - meta
      properties:
        account:
          $ref: '#/components/schemas/AccountInfo'
        meta:
          $ref: '#/components/schemas/AccountMetaData'
    AccountId:
      type: object
      description: Wrapper for an account address.
      required:
        - account
      properties:
        account:
          $ref: '#/components/schemas/Address'
    accounts:
      type: object
      description: List of account addresses.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountId'
      examples:
        - data:
            - account: NDZQI4MPLUCFVWQY5P6LD5LFLH2NVDYOQ347DATW
            - account: NAXF4PC4RUB7HRKCCVDWFLILUUAO2HRETM34OCQZ
    BlockHeight:
      type: integer
      format: int64
      description: |
        Position of a block in the blockchain. The first block has height 1; each new block increments by one.
      minimum: 1
      examples:
        - 17592
    PageRank:
      type: number
      format: double
      description: |
        PageRank of the account in the NEM Proof of Importance (POI) model: a value between 0 and 1 that reflects the account's 
        relative importance in the transfer graph (accounts and XEM transfers between them).
        It is one of the inputs to the final importance score.
      examples:
        - 0.0007605047835049349
    AccountHistoricalData:
      type: object
      description: Historical account data at a specific block height.
      required:
        - height
        - address
        - balance
        - vestedBalance
        - unvestedBalance
        - importance
        - pageRank
      properties:
        height:
          $ref: '#/components/schemas/BlockHeight'
          description: Block height at which the data was recorded.
        address:
          $ref: '#/components/schemas/Address'
        balance:
          $ref: '#/components/schemas/Amount'
          description: Account balance in micro XEM.
        vestedBalance:
          $ref: '#/components/schemas/Amount'
          description: Vested balance in micro XEM.
        unvestedBalance:
          $ref: '#/components/schemas/Amount'
          description: Unvested balance in micro XEM.
        importance:
          $ref: '#/components/schemas/Importance'
          description: Account importance at this block height.
        pageRank:
          $ref: '#/components/schemas/PageRank'
          description: PageRank value associated with the account.
    AccountHistoricalDataList:
      type: object
      description: Historical account data list.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountHistoricalData'
    BlockReference:
      type: object
      required:
        - height
      properties:
        height:
          $ref: '#/components/schemas/BlockHeight'
    Hash:
      type: string
      description: The 256-bit SHA3 hash encoded as a hexadecimal string (64 characters).
      examples:
        - 81d52a7df4abba8bb1613bcc42b6b93cf3114524939035d88ae8e864cd2c34c8
    HashReference:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Hash'
    Transaction:
      type: object
      description: Base NEM transaction object.
      required:
        - type
        - version
        - timeStamp
        - deadline
        - signer
      properties:
        timeStamp:
          $ref: '#/components/schemas/NetworkTimeStamp'
          description: |
            Network timestamp in seconds since the NEM network epoch (29 March 2015, 00:06:25 UTC).
            Creation time of the transaction. Future timestamps are not allowed; validation returns an error.
            Network time synchronization ensures that NEM software uses valid timestamps when creating transactions.
        signature:
          oneOf:
            - type: string
            - type: 'null'
          description: |
            The transaction signature. 
            The transaction signature is validated using the supplied public key in the field signer. 
            If the signature is not valid, an error is returned from validation.
        fee:
          $ref: '#/components/schemas/Amount'
          description: |
            The fee (in micro XEM) for the transaction. The higher the fee, the higher is the priority of the transaction. 
            Transactions with high priority get included in a block before transactions with lower priority. 
            If the sender does not have enough funds the validation will result in an error.
        type:
          type: integer
          description: |
            Transaction type identifier. The following types (as decimal integer) are supported:
            - `257`: Transfer Transaction
            - `2049`: Importance Transfer Transaction
            - `4097`: Multisig Aggregate Modification Transaction
            - `4098`: Multisig Signature Transaction
            - `4100`: Multisig Transaction
            - `8193`: Provision Namespace Transaction
            - `16385`: Mosaic Definition Creation Transaction
            - `16386`: Mosaic Supply Change Transaction
        deadline:
          $ref: '#/components/schemas/NetworkTimeStamp'
          description: |
            Network timestamp in seconds since the NEM network epoch (29 March 2015, 00:06:25 UTC).
            Deadline for the transaction; if not included in a block before this time, the transaction is discarded.
        version:
          type: integer
          description: |
            The transaction version. In the API this field is a decimal integer (e.g. `1744830466`). 
            Internally it is a 32-bit value whose bits are often referred to in hex (e.g. `0x68000002`): the high 8 bits are the network identifier (`0x68` mainnet, `0x98` testnet), 
            and the low 24 bits are the entity version (`1` or `2`, depending on transaction type and fork height).

            Examples (hex and decimal):
            - `0x68000001` = `1744830465`: mainnet, entity version `1`
            - `0x98000001` = `-1744830463`: testnet, entity version `1`
            - `0x68000002` = `1744830466`: mainnet, entity version `2`
            - `0x98000002` = `-1744830462`: testnet, entity version `2`

            The network byte is fixed for a given network; the entity version is validated per transaction type and fork height
            (see `VersionTransactionValidator` in the NEM node implementation).
        signer:
          $ref: '#/components/schemas/PublicKey'
          description: |
            The public key (256-bit encoded as a hexadecimal string - 64 hex characters) of the account that created the transaction.
      discriminator:
        propertyName: type
        mapping:
          '257': '#/components/schemas/TransferTransaction'
          '2049': '#/components/schemas/ImportanceTransferTransaction'
          '4097': '#/components/schemas/MultisigAggregateModificationTransaction'
          '4098': '#/components/schemas/MultisigSignatureTransaction'
          '4100': '#/components/schemas/MultisigTransaction'
          '8193': '#/components/schemas/ProvisionNamespaceTransaction'
          '16385': '#/components/schemas/MosaicDefinitionCreationTransaction'
          '16386': '#/components/schemas/MosaicSupplyChangeTransaction'
    NamespaceId:
      type: string
      description: Fully qualified namespace identifier (e.g., `makoto.metal.coins`).
      minLength: 1
      examples:
        - makoto.metal.coins
    MosaicId:
      type: object
      description: Uniquely identifies a mosaic definition.
      properties:
        namespaceId:
          $ref: '#/components/schemas/NamespaceId'
        name:
          type: string
          description: The mosaic name.
    Mosaic:
      type: object
      description: |
        A mosaic describes an instance of a mosaic definition. Mosaics can be transferred by means of a transfer transaction.
      properties:
        mosaicId:
          $ref: '#/components/schemas/MosaicId'
        quantity:
          type: integer
          description: |
            The mosaic quantity. The quantity is always given in smallest units for the mosaic.
            E.g., if it has a divisibility of 3, the quantity is given in thousandths.
    TransferTransaction:
      description: |
        Transfer transactions contain data about transfers of XEM or mosaics to another account.
        There are two versions of transfer transactions, version 1 and version 2. 
        Version 1 transfer transactions are only capable of transferring XEM and a message 
        while version 2 transfer transactions additionally can transfer a set of mosaics.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          description: Transfer transaction object.
          required:
            - recipient
            - amount
          properties:
            recipient:
              $ref: '#/components/schemas/Address'
              description: The address of the recipient (40 characters, Base32-encoded, checksum-validated).
            amount:
              $ref: '#/components/schemas/Amount'
              description: |
                The amount of micro XEM that is transferred from sender to recipient for version 1 type.
                For version 2 transaction types amount field acts as multiplier for mosaic array.
                Please check examples available here https://docs.nem.io/pages/Exchanges/integration/examples/docs.en.html.
            message:
              type: object
              description: |
                Optional message. The value is always an object, never null.
                When the transaction contains a message, the object has `payload` and `type`.
                When there is no message, the object is empty `{}`.
              properties:
                payload:
                  type: string
                  description: |
                    The payload is the actual (possibly encrypted) message data.
                type:
                  type: integer
                  description: |
                    The field holds the message type information. Possible message types are:
                    - 1: The message is not encrypted.
                    - 2: The message is encrypted.
                  enum:
                    - 1
                    - 2
            mosaics:
              type: array
              description: The array of transferred mosaics.
              items:
                $ref: '#/components/schemas/Mosaic'
    ImportanceTransferTransaction:
      description: |
        The NEM client has the ability to transfer the importance of one account to another account for harvesting.
        The account receiving the importance is called the delegated account.
        Importance transfer transactions are part of the secure harvesting feature of NEM.
        Once an importance transfer transaction has been included in a block,
        it needs 6 hours to become active.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          description: Importance transfer transaction object.
          required:
            - mode
            - remoteAccount
          properties:
            mode:
              type: integer
              enum:
                - 1
                - 2
              description: |
                Importance transfer mode:
                - 1: Activate delegated harvesting
                - 2: Deactivate delegated harvesting
            remoteAccount:
              $ref: '#/components/schemas/PublicKey'
              description: |
                The public key (256-bit encoded as a hexadecimal string - 64 characters) of the delegated (remote) account. 
    MultisigCosignatoryModification:
      type: object
      description: |
        Multisig cosignatory modification.
        This object represents the addition or removal of a cosignatory
        from a multisig account.
      required:
        - modificationType
        - cosignatoryAccount
      properties:
        modificationType:
          type: integer
          enum:
            - 1
            - 2
          description: |
            Type of cosignatory modification:
            - 1: Add a new cosignatory
            - 2: Remove an existing cosignatory
        cosignatoryAccount:
          $ref: '#/components/schemas/PublicKey'
          description: Public key of the cosignatory account.
    MultisigMinCosignatoriesModification:
      type: object
      description: |
        Multisig minimum cosignatories modification.
        This object specifies a relative change to the minimum number of cosignatories
        required to approve a multisig transaction.
      required:
        - relativeChange
      properties:
        relativeChange:
          type: integer
          description: |
            Relative change of the minimum number of cosignatories.
            A positive value increases the required number of cosignatories,
            while a negative value decreases it.
          examples:
            - 1
    MultisigAggregateModificationTransaction:
      description: |
        Multisig aggregate modification transactions are part of the NEM multisig account system and are used to change the configuration
        of a multisig account: they can add or remove cosignatories and (optionally) adjust the minimum number of required cosignatories.

        A multisig aggregate modification transaction holds:
        - an array of multisig cosignatory modifications (`modifications`), and
        - an optional multisig minimum cosignatories modification (`minCosignatories`).

        This transaction is embedded inside a multisig transaction, which is then signed by the cosignatories of the multisig account.

        The current entity version for multisig aggregate modification transactions is `2`. This corresponds to the following
        serialized `version` field values (network byte + entity version):
        - `0x68000002` (decimal `1744830466`) on mainnet
        - `0x98000002` (decimal `-1744830462`) on testnet
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required:
            - modifications
          properties:
            modifications:
              type: array
              description: Array of multisig modifications.
              items:
                $ref: '#/components/schemas/MultisigCosignatoryModification'
            minCosignatories:
              $ref: '#/components/schemas/MultisigMinCosignatoriesModification'
    MultisigSignatureTransaction:
      description: |
        Multisig signature transactions are part of the NEM's multisig account system. 
        Multisig signature transactions are included in the corresponding multisig transaction and are the way a cosignatory 
        of a multisig account can sign a multisig transaction for that account.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          description: Multisig Signature Transaction object.
          required:
            - otherHash
            - otherAccount
          properties:
            otherHash:
              $ref: '#/components/schemas/HashReference'
              description: |
                Hash of the inner transaction of the corresponding multisig transaction (256-bit SHA3, hex string - 64 characters).
            otherAccount:
              $ref: '#/components/schemas/Address'
              description: |
                Address of the multisig account for which the transaction is being cosigned (40 characters, Base32-encoded, checksum-validated).
    ProvisionNamespaceTransaction:
      description: |
        Used both to **register** (rent) a new namespace and to **renew** (extend) an existing root namespace for another year.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          description: Provision Namespace Transaction object.
          required:
            - rentalFeeSink
            - rentalFee
            - newPart
          properties:
            rentalFeeSink:
              $ref: '#/components/schemas/PublicKey'
              description: |
                Public key (256-bit encoded as a hexadecimal string - 64 hex characters) of the **rental fee sink**: the network-designated account that receives the rental fee.
                Must be the sink defined for this network (mainnet, testnet, etc.); otherwise validation fails with `FAILURE_NAMESPACE_INVALID_RENTAL_FEE_SINK`.
                Use the value provided by the SDK or network docs for the network you are using.
            rentalFee:
              $ref: '#/components/schemas/Amount'
              description: |
                The fee (in micro XEM) for renting the namespace.
                Must be at least the network-defined minimum for the given namespace type (root vs. sub-namespace); 
                transactions with a lower value are rejected with `FAILURE_NAMESPACE_INVALID_RENTAL_FEE`.
                The exact minimum is defined in the network configuration / fork schedule and can change over time,
                so clients should use values provided by the SDK or network documentation rather than hardcoding them.
            newPart:
              type: string
              description: The new part which is concatenated to the parent with a '.' as separator.
            parent:
              oneOf:
                - type: string
                - type: 'null'
              description: The parent namespace. This can be null if the transaction rents a root namespace.
    MosaicProperty:
      type: object
      description: |
        Single mosaic property entry.
        Each property defines a characteristic of the mosaic.
      required:
        - name
        - value
      properties:
        name:
          type: string
          description: |
            Name of the mosaic property.
            Supported values:
            - `divisibility`: Number of decimal places for sub-units (0–6). A divisibility of 3 means the smallest
              unit is 0.001 (e.g. 1000 = 1.000 mosaic). Transfer quantities are in these smallest units. Default "0".
            - `initialSupply`: Initial supply when creating the mosaic, in whole units (not smallest sub-units).
              Must be between 0 and 9,000,000,000. Default "1,000".
            - `supplyMutable`: Whether the mosaic supply can be changed later. Values "true" or "false". Default "false".
            - `transferable`: Whether the mosaic can be transferred by any account. If "false", only the creator
              can be sender or recipient. Values "true" or "false". Default "true".
          enum:
            - divisibility
            - initialSupply
            - supplyMutable
            - transferable
        value:
          type: string
          description: |
            Property value, always a string. Interpretation depends on the property name:
            - `divisibility`: integer (0–6)
            - `initialSupply`: integer (max 9,000,000,000)
            - `supplyMutable`: "true" or "false"
            - `transferable`: "true" or "false"
    MosaicLevy:
      type: object
      description: |
        Optional levy applied when transferring mosaics. The value is always an object, never null.
        A levy defines a fee that is transferred to a recipient whenever the mosaic is moved.
        If the mosaic has no levy defined, the object is empty `{}`.
        If a levy is defined, the object has `type`, `recipient`, `mosaicId`, and `fee`.
      properties:
        type:
          type: integer
          description: |
            Levy type:
            - `1`: Absolute fee: The fee is specified as absolute quantity and thus does not depend on the quantity 
              that is transferred.
            - `2`: Percentage fee: The fee is specified as a percentage of the quantity transferred.
              The fee increases linearly with the transferred mosaic quantity.
              For this type, `fee` is in **basis points** (1/100 of a percent): **10000 = 100%**, 1000 = 10%, 100 = 1%.
          enum:
            - 1
            - 2
        recipient:
          $ref: '#/components/schemas/Address'
          description: Recipient (40 characters, Base32-encoded, checksum-validated) of the levy. This can be any account.
        mosaicId:
          $ref: '#/components/schemas/MosaicId'
          description: |
            ID of the mosaic in which the fee must be paid. Any existing mosaic can be specified.
            For fees in XEM, use the mosaic ID `nem:xem`.
        fee:
          $ref: '#/components/schemas/Amount'
          description: |
            Fee value. Interpretation depends on `type`:
            - Type `1` (Absolute): fee is the exact quantity to charge (same units as the levy mosaic).
            - Type `2` (Percentage): fee is in basis points; 10000 = 100%, 1000 = 10%, 100 = 1%.
    MosaicDefinition:
      type: object
      description: A mosaic definition describes an asset type on the network.
      required:
        - creator
        - id
        - description
        - properties
      properties:
        creator:
          $ref: '#/components/schemas/PublicKey'
        id:
          $ref: '#/components/schemas/MosaicId'
        description:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            Mosaic description. Must be non-empty and at most 512 characters.
        properties:
          description: Mosaic properties.
          type: array
          items:
            $ref: '#/components/schemas/MosaicProperty'
        levy:
          $ref: '#/components/schemas/MosaicLevy'
    MosaicDefinitionCreationTransaction:
      description: |
        Before a mosaic can be created or transferred, a corresponding definition of the mosaic has 
        to be created and published to the network. This is done via a mosaic definition creation transaction.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          description: Mosaic Definition Creation Transaction object.
          required:
            - mosaicDefinition
            - creationFee
            - creationFeeSink
          properties:
            mosaicDefinition:
              $ref: '#/components/schemas/MosaicDefinition'
              description: The mosaic definition to be created.
            creationFee:
              $ref: '#/components/schemas/Amount'
              description: The fee (in micro XEM) for the creation of the mosaic.
            creationFeeSink:
              $ref: '#/components/schemas/PublicKey'
              description: The public key of the account to which the creation fee is transferred.
    MosaicSupplyChangeTransaction:
      description: |
        A mosaic supply change transaction increases or decreases the supply of a mosaic.
        This transaction can only be executed by the creator of the mosaic definition,
        and only if the mosaic property `supplyMutable` is set to `true`.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          description: Mosaic Supply Change Transaction object.
          required:
            - mosaicId
            - supplyType
            - delta
          properties:
            mosaicId:
              $ref: '#/components/schemas/MosaicId'
              description: The mosaic identifier whose supply is being modified.
            supplyType:
              type: integer
              enum:
                - 1
                - 2
              description: |
                Supply change type:
                - 1: Increase the mosaic supply
                - 2: Decrease the mosaic supply
            delta:
              type: integer
              description: |
                Amount by which the mosaic supply is changed, in **whole units** of the mosaic (not smallest units).
                For example, with divisibility 2, a delta of `100` increases or decreases supply by 100.00 units.
    NonMultisigTransaction:
      oneOf:
        - $ref: '#/components/schemas/TransferTransaction'
        - $ref: '#/components/schemas/ImportanceTransferTransaction'
        - $ref: '#/components/schemas/MultisigAggregateModificationTransaction'
        - $ref: '#/components/schemas/ProvisionNamespaceTransaction'
        - $ref: '#/components/schemas/MosaicDefinitionCreationTransaction'
        - $ref: '#/components/schemas/MosaicSupplyChangeTransaction'
      discriminator:
        propertyName: type
        mapping:
          '257': '#/components/schemas/TransferTransaction'
          '2049': '#/components/schemas/ImportanceTransferTransaction'
          '4097': '#/components/schemas/MultisigAggregateModificationTransaction'
          '8193': '#/components/schemas/ProvisionNamespaceTransaction'
          '16385': '#/components/schemas/MosaicDefinitionCreationTransaction'
          '16386': '#/components/schemas/MosaicSupplyChangeTransaction'
    MultisigTransaction:
      description: |
        Multisig transactions are the only way to make transactions from a multisig account to another account.
        A multisig transaction carries another transaction inside (often referred to as "inner" transaction). 
        The inner transaction can be for example a transfer, an importance transfer or an aggregate modification transaction. 
        A multisig transaction also has multisig signature transactions from the cosignatories of the multisig account inside.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          description: Multisig Transaction object.
          required:
            - otherTrans
          properties:
            otherTrans:
              $ref: '#/components/schemas/NonMultisigTransaction'
              description: |
                The inner transaction. The inner transaction can be a transfer transaction, an importance transfer transaction 
                or a multisig aggregate modification transaction. The inner transaction does not have a valid signature.
            signatures:
              type: array
              items:
                $ref: '#/components/schemas/MultisigSignatureTransaction'
              description: The array of signatures.
    Block:
      type: object
      description: |
        A block is the structure that contains transaction information. Blocks are generated and signed by accounts.
        A block can contain up to 120 transactions. This limit does not apply to the first block (nemesis/genesis block).
      required:
        - timeStamp
        - signature
        - prevBlockHash
        - type
        - transactions
        - version
        - signer
        - height
      properties:
        timeStamp:
          $ref: '#/components/schemas/NetworkTimeStamp'
          description: |
            Network timestamp in seconds since the NEM network epoch (29 March 2015, 00:06:25 UTC).
            Time of the block.
        signature:
          type: string
          description: Signature of the block generated by the signer. Used to validate block integrity.
        prevBlockHash:
          $ref: '#/components/schemas/HashReference'
          description: The previous block hash.
        type:
          type: integer
          description: |
            The block type. There are currently two block types used:
            - -1: Nemesis block
            - 1: Regular block
          enum:
            - -1
            - 1
        transactions:
          type: array
          description: |
            Array of transactions included in the block. Maximum 120 for regular blocks; the nemesis block is not subject to this limit.
          items:
            $ref: '#/components/schemas/Transaction'
        version:
          type: integer
          format: int32
          description: |
            Block version. Supported values:
            - 1744830465 (main network)
            - -1744830463 (test network)
        signer:
          $ref: '#/components/schemas/PublicKey'
          description: |
            Public key (256-bit encoded as a hexadecimal string - 64 hex characters) of the harvester of the block.
        height:
          $ref: '#/components/schemas/BlockHeight'
    BlockDifficulty:
      type: integer
      format: int64
      description: |
        The block difficulty. The initial difficulty was set to 100'000'000'000'000.
        The block difficulty is always between one tenth and ten times the initial difficulty.
      examples:
        - 26453656336676
    TransactionWithHash:
      type: object
      description: A transfer model extended by transaction hash.
      required:
        - tx
        - hash
      properties:
        tx:
          $ref: '#/components/schemas/Transaction'
        hash:
          $ref: '#/components/schemas/Hash'
          description: Transaction hash.
        innerHash:
          $ref: '#/components/schemas/Hash'
          description: |
            Hash of the inner transaction embedded inside a multisig transaction (the `otherTransaction` of a multisig).
            Present only when `tx` is a multisig transaction; the property is absent when the transaction is not multisig.
    ExtendedBlock:
      type: object
      description: |
        Extended block data used by NEM client services such as the block explorer.
      required:
        - block
        - hash
        - difficulty
        - txes
        - beneficiary
        - totalFee
      properties:
        block:
          $ref: '#/components/schemas/Block'
        hash:
          $ref: '#/components/schemas/Hash'
          description: |
            Block hash (the 256-bit SHA3 hash encoded as a hexadecimal string - 64 characters).
        difficulty:
          $ref: '#/components/schemas/BlockDifficulty'
        txes:
          type: array
          description: List of transactions contained in the block along with their corresponding transaction hashes.
          items:
            $ref: '#/components/schemas/TransactionWithHash'
        beneficiary:
          $ref: '#/components/schemas/Address'
          description: |
            Address (40 characters, Base32-encoded; first character indicates network: T testnet, N mainnet) 
            of the account that receives the block fees (the harvester, or the delegator when harvesting is delegated).
        totalFee:
          $ref: '#/components/schemas/Amount'
          description: Total fee (in micro XEM) collected from all transactions in the block.
    ExtendedBlockList:
      type: object
      description: |
        A list of extended block data returned by the node. The list contains up to 10 blocks.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExtendedBlock'
    BlockchainScore:
      type: object
      description: |
        The blockchain score is a measure of how good the blockchain is; the higher the score, the better the chain.

        It is the sum of per-block scores over the chain. Each block contributes `(difficulty − time since previous block)`:
        higher block difficulty and/or shorter time between blocks increase the chain score. It is used by nodes to choose the best
        chain when multiple chains exist (e.g. after a network split).
      required:
        - score
      properties:
        score:
          type: string
          description: |
            Blockchain score as a hexadecimal string representing a non-negative integer (BigInteger).
            The numeric value is used for comparison; the API uses hex to avoid precision loss for large numbers.
          pattern: ^[0-9a-fA-F]+$
    TimerInformation:
      type: object
      description: |
        The NEM client uses timers to schedule periodic tasks. Those tasks are monitored
        and their result is memorized. The NemAsyncTimerVisitor structure holds the information.
      required:
        - last-delay-time
        - executions
        - failures
        - successes
        - last-operation-start-time
        - is-executing
        - name
        - average-operation-time
        - last-operation-time
      properties:
        last-delay-time:
          type: integer
          format: int32
          description: The number of milliseconds since the last execution of the timer.
          examples:
            - 3000
        executions:
          type: integer
          format: int32
          description: The number of times the task was executed.
          examples:
            - 1024
        failures:
          type: integer
          format: int32
          description: The number of times the task failed.
          examples:
            - 0
        successes:
          type: integer
          format: int32
          description: The number of times the task completed successfully.
          examples:
            - 1024
        last-operation-start-time:
          $ref: '#/components/schemas/NetworkTimeStamp'
          description: |
            Network timestamp in seconds since the NEM network epoch (29 March 2015, 00:06:25 UTC).
            Time at which the task last started.
        is-executing:
          type: integer
          format: int32
          description: |
            Indicates whether the task is currently executing.
            1 = true, 0 = false.
          enum:
            - 0
            - 1
          examples:
            - 0
        name:
          type: string
          description: The name of the task (timer).
          examples:
            - FORAGING
        average-operation-time:
          type: integer
          format: int32
          description: The number of seconds the task needed on average.
          examples:
            - 0
        last-operation-time:
          type: integer
          format: int32
          description: The number of seconds the task needed the last time.
          examples:
            - 0
    ConnectionAuditEntry:
      type: object
      description: |
        Information about a single **audited request**: a request that was recorded by the node for inspection.
        "Audit" means the request is tracked (who, which path, when, how long) for debug/trace purposes - not a security or compliance audit.
      required:
        - id
        - host
        - path
        - start-time
        - elapsed-time
      properties:
        id:
          type: integer
          format: int32
          description: The unique id of the request.
          examples:
            - 797725
        host:
          type: string
          description: Remote host (for incoming audits the caller's address; for outgoing audits the peer being called).
          examples:
            - 86.124.91.183
        path:
          type: string
          description: The relative URL path.
          examples:
            - /chain/score
        start-time:
          type: integer
          format: int64
          description: |
            Time when the request was received, in number of seconds elapsed since the creation of the nemesis block.
          examples:
            - 9020618
        elapsed-time:
          type: integer
          format: int32
          description: The time in seconds that has elapsed since the request was received.
          examples:
            - 5
    ConnectionAuditResult:
      type: object
      description: |
        Two collections of audited requests (each entry is a recorded request; see connection audit entry).
        - outstanding: requests currently in progress (not yet completed).
        - most-recent: sliding window of the most recently recorded requests.
        Intended for debug purposes.
      required:
        - outstanding
        - most-recent
      properties:
        outstanding:
          type: array
          description: Audited requests currently in progress.
          items:
            $ref: '#/components/schemas/ConnectionAuditEntry'
        most-recent:
          type: array
          description: Most recently recorded audited requests (sliding window).
          items:
            $ref: '#/components/schemas/ConnectionAuditEntry'
    TimeSynchronizationResult:
      type: object
      description: |
        A time synchronization result is the outcome of the network time synchronization of a node with other remote nodes.
      required:
        - dateTime
        - currentTimeOffset
        - change
      properties:
        dateTime:
          type: string
          description: The date and time when the synchronization was performed.
          examples:
            - '2014-11-16 20:47:06'
        currentTimeOffset:
          type: integer
          format: int64
          description: The current offset to the local computer clock in milliseconds.
          examples:
            - 2786
        change:
          type: integer
          format: int64
          description: The change in milliseconds compared to the last synchronization.
          examples:
            - 36
    TimeSynchronizationResultList:
      type: object
      description: Object containing time synchronization results.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimeSynchronizationResult'
    privateKey:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/PrivateKey'
    HarvestingStats:
      type: object
      description: |
        Information about the current and maximum number of harvesters (accounts unlocked for harvesting) on this node.
        Harvesters may be main accounts (harvesting with their own key) or delegated (remote) accounts; both are counted.
      required:
        - num-unlocked
        - max-unlocked
      properties:
        num-unlocked:
          type: integer
          format: int32
          description: The current number of harvesters on this node.
          examples:
            - 2
        max-unlocked:
          type: integer
          format: int32
          description: The maximum number of harvesters allowed on this node.
          examples:
            - 3
    DatabaseId:
      type: integer
      format: int64
      description: Unique identifier of the object (e.g., block, transaction) in the node database.
      examples:
        - 5646403
      minimum: 1
    PageSize:
      type: integer
      description: Number of entries to return.
      minimum: 5
      maximum: 100
      default: 25
      examples:
        - 50
    HarvestInfo:
      type: object
      description: Information about a block that an account harvested.
      properties:
        id:
          $ref: '#/components/schemas/DatabaseId'
          description: The database id for the harvested block.
        height:
          $ref: '#/components/schemas/BlockHeight'
          description: The height of the harvested block.
        timeStamp:
          $ref: '#/components/schemas/NetworkTimeStamp'
          description: |
            Network timestamp in seconds since the NEM network epoch (29 March 2015, 00:06:25 UTC).
            Timestamp of the harvested block.
        totalFee:
          $ref: '#/components/schemas/Amount'
          description: The total fee (in micro XEM) collected by harvesting the block.
        difficulty:
          $ref: '#/components/schemas/BlockDifficulty'
      required:
        - id
        - height
        - timeStamp
        - totalFee
        - difficulty
    AccountImportance:
      type: object
      description: |
        Account importance information.

        If `isSet` is 0, importance is not available and no additional fields are present.
        If `isSet` is 1, importance-related fields such as `score`, `ev`, and `height` are included.
      required:
        - isSet
      properties:
        isSet:
          type: integer
          format: int32
          enum:
            - 0
            - 1
          description: When set to 1, indicates that the fields `score`, `ev` and `height` are present.
          examples:
            - 1
        score:
          $ref: '#/components/schemas/Importance'
        ev:
          $ref: '#/components/schemas/PageRank'
        height:
          $ref: '#/components/schemas/BlockHeight'
          description: The height at which the importance calculation was performed.
    AccountImportanceData:
      type: object
      description: Object containing account address and importance information.
      properties:
        address:
          $ref: '#/components/schemas/Address'
        importance:
          $ref: '#/components/schemas/AccountImportance'
      required:
        - address
        - importance
    MosaicIdSupplyPair:
      type: object
      required:
        - mosaicId
        - supply
      properties:
        mosaicId:
          $ref: '#/components/schemas/MosaicId'
        supply:
          $ref: '#/components/schemas/Amount'
          description: Total supply of the mosaic; token amount in smallest unit (no decimals), non-negative.
    MosaicMetaData:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/DatabaseId'
          description: Mosaic database identifier used for paging.
    MosaicDefinitionMetaDataPair:
      type: object
      required:
        - mosaic
        - meta
      properties:
        mosaic:
          $ref: '#/components/schemas/MosaicDefinition'
        meta:
          $ref: '#/components/schemas/MosaicMetaData'
    MosaicDefinitionSupplyTuple:
      type: object
      required:
        - mosaicDefinition
        - supply
        - expirationHeight
      properties:
        mosaicDefinition:
          $ref: '#/components/schemas/MosaicDefinition'
        supply:
          $ref: '#/components/schemas/Amount'
          description: Current supply of the mosaic. Token amount in smallest unit (no decimals).
        expirationHeight:
          $ref: '#/components/schemas/BlockHeight'
          description: Expiration height of the owning namespace.
    AddressBalancePair:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        quantity:
          $ref: '#/components/schemas/Amount'
          description: Mosaic quantity held at expiry. Token amount in smallest unit (no decimals).
      required:
        - address
        - quantity
    ExpiredMosaic:
      type: object
      description: |
        Single expired or restored mosaic at a given block height, including balances per account at time of expiry.
      properties:
        mosaicId:
          $ref: '#/components/schemas/MosaicId'
        expiredMosaicType:
          type: integer
          description: |
            Event type at this height:
            - `1`: Expired — mosaic (owning namespace) expired and balances were zeroed.
            - `2`: Restored — mosaic was restored (namespace renewal) and balances reapplied.
          enum:
            - 1
            - 2
        balances:
          type: array
          items:
            $ref: '#/components/schemas/AddressBalancePair'
          description: Account addresses and mosaic quantities held at the time of expiry.
      required:
        - mosaicId
        - expiredMosaicType
        - balances
    ExpiredMosaicList:
      type: object
      description: Response wrapper for the list of mosaics that expired or were restored at a given block height.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExpiredMosaic'
          description: List of expired/restored mosaic entries (one per mosaic id at that height).
    NamespaceMetaData:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/DatabaseId'
          description: Namespace database identifier used for paging.
    Namespace:
      type: object
      required:
        - fqn
        - owner
        - height
      properties:
        fqn:
          type: string
          description: Fully-qualified namespace name.
          examples:
            - makoto.metal.coins
        owner:
          $ref: '#/components/schemas/Address'
          description: Address of the namespace owner.
        height:
          $ref: '#/components/schemas/BlockHeight'
          description: Block height at which ownership begins.
    NamespaceMetaDataPair:
      type: object
      required:
        - meta
        - namespace
      properties:
        meta:
          $ref: '#/components/schemas/NamespaceMetaData'
        namespace:
          $ref: '#/components/schemas/Namespace'
    NamespaceMetaDataPairList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NamespaceMetaDataPair'
    NodeIdentity:
      type: object
      description: |
        Represents the identity of a node.
        The identity is tied to a cryptographic key pair and uniquely identifies the node in the network.
      required:
        - public-key
      properties:
        name:
          oneOf:
            - type: string
            - type: 'null'
          description: The name of the node.
          examples:
            - Alice
        public-key:
          $ref: '#/components/schemas/PublicKey'
          description: Public key used to identify the node.
    NodeEndpoint:
      type: object
      description: Network endpoint used by the node for communication.
      required:
        - protocol
        - host
        - port
      properties:
        protocol:
          type: string
          description: The protocol used for the communication (http or https).
          enum:
            - http
            - https
          examples:
            - http
        host:
          type: string
          description: Hostname or IP address of the node.
          examples:
            - 81.224.224.156
        port:
          type: integer
          format: int32
          description: Port used for communication.
          examples:
            - 7890
    NodeMetaData:
      type: object
      description: Additional metadata describing the node.
      required:
        - version
        - networkId
        - features
      properties:
        features:
          type: integer
          format: int32
          description: |
            Bitmask of optional features this node supports. Built by bitwise OR of the feature flags below.
            Clients can test support with a bitwise AND (e.g. `(features & 0x2) !== 0` for historical account data).
            Known flags:
            - `0x1`: Transaction hash lookup. Node can look up transactions by hash (e.g. `/transaction/get`).
            - `0x2`: Historical account data. Node exposes historical account state.
            - `0x4`: Track expired mosaics. Node tracks and can list expired mosaics.
            Example: value `3` means `0x1 | 0x2`, i.e. transaction hash lookup and historical account data.
          examples:
            - 3
        networkId:
          type: integer
          format: int32
          description: |
            Network identifier. Identifies which blockchain the node is running on. Nodes with different `networkId`
            values are on different networks and are not compatible. Peers only connect to nodes with
            the same `networkId`.
            Known values:
            - `104`: Main network (public NEM mainnet)
            - `-104`: Test network (public testnet)
          examples:
            - -104
        application:
          oneOf:
            - type: string
            - type: 'null'
          description: |
            Optional name of the application running the node, as reported when the node is booted.
            For NIS this is typically a short product name such as `NIS` or `NEM Infrastructure Server`,
            but the exact value is free-form and comes from the local node / client configuration.
            If this field is `null`, it simply means no application name was provided; the node still works
            normally.
          examples:
            - NIS
        version:
          type: string
          description: Version of the node software.
          examples:
            - 0.6.100
        platform:
          oneOf:
            - type: string
            - type: 'null'
          description: |
            Underlying platform (OS and Java version).
            NIS populates this from the Java runtime system properties (for example
            `java.vendor` + `java.version` + `os.name`), so typical values look like
            `Oracle Corporation (1.8.0_151) on Linux`.
            The format is free-form and intended for diagnostics / debugging only; clients
            should not rely on a strict schema here.
          examples:
            - Oracle Corporation (1.8.0_151) on Linux
    Node:
      type: object
      description: |
        Represents a node in the NEM network.

        A node consists of an identity, an endpoint used for communication, and additional metadata describing the node.
      required:
        - identity
        - endpoint
        - metaData
      properties:
        identity:
          $ref: '#/components/schemas/NodeIdentity'
        endpoint:
          $ref: '#/components/schemas/NodeEndpoint'
        metaData:
          $ref: '#/components/schemas/NodeMetaData'
      examples:
        - metaData:
            features: 1
            application: NIS
            networkId: -104
            version: 0.4.33-BETA
            platform: Oracle Corporation (1.8.0_25) on Windows 8
          endpoint:
            protocol: http
            port: 7890
            host: 81.224.224.156
          identity:
            name: Alice
            public-key: a1aaca6c17a24252e674d155713cdf55996ad00175be4af02a20c67b59f9fe8a
    NodeApplicationMetaData:
      type: object
      description: |
        Metadata about the NEM client application (the server software running on this node).
      required:
        - application
        - version
        - startTime
        - currentTime
      properties:
        application:
          type: string
          description: Application name.
          examples:
            - NEM Deploy
        version:
          type: string
          description: Application version string.
          examples:
            - 0.6.102
        signer:
          oneOf:
            - type: string
            - type: 'null'
          description: Signer of the certificate used by the application.
          examples:
            - CN=NEM Community,OU=Development Team,O=NEM,L=Internet,ST=web,C=WD
        startTime:
          $ref: '#/components/schemas/NetworkTimeStamp'
          description: |
            Network timestamp in seconds since the NEM network epoch (29 March 2015, 00:06:25 UTC).
            Time at which the application was started.
        currentTime:
          $ref: '#/components/schemas/NetworkTimeStamp'
          description: |
            Network timestamp in seconds since the NEM network epoch (29 March 2015, 00:06:25 UTC).
            Current network time.
    ExtendedNode:
      type: object
      description: |
        Provides extended information about a node.
        It contains both the node description and application-level metadata.
      required:
        - node
        - nisInfo
      properties:
        node:
          $ref: '#/components/schemas/Node'
        nisInfo:
          $ref: '#/components/schemas/NodeApplicationMetaData'
    NodeCollection:
      type: object
      description: |
        A collection of nodes grouped by their connection status.
        Each field contains an array of node data objects corresponding to the given status.
      properties:
        active:
          type: array
          description: |
            Nodes that have this status can be successfully communicated with. 
            Whenever a node is selecting another node for communication, it will pick one from this list.
          items:
            $ref: '#/components/schemas/Node'
        busy:
          type: array
          description: |
            A node is set to status 'busy' if a connection can be established but the node did not answer 
            a request within a certain time limit.
          items:
            $ref: '#/components/schemas/Node'
        inactive:
          type: array
          description: Inactive nodes are nodes with which it is not possible to establish a connection.
          items:
            $ref: '#/components/schemas/Node'
        failure:
          type: array
          description: |
            The failure status is assigned to a remote node when a severe error occurs during communication,
            for example a different protocol version or an unexpected node identity.
          items:
            $ref: '#/components/schemas/Node'
      required:
        - active
        - busy
        - inactive
        - failure
    NodeList:
      type: object
      description: Wrapper object used to return a list of nodes.
      required:
        - data
      properties:
        data:
          type: array
          description: List of nodes.
          items:
            $ref: '#/components/schemas/Node'
    BootNodeMetaData:
      type: object
      description: Boot node meta data.
      properties:
        application:
          type: string
          description: |
            Optional application name for the local node. If provided, it is stored in the node's metadata and is then
            exposed in `GET /node/info` (and in extended node info) and sent to peers when the node identifies itself.
            It is a human-readable label for the running software (e.g. `NIS`, `NEM Deploy`). Platform and version are
            filled in automatically by the NEM client, so this is the only metadata field that can be set at boot time.
    BootNodeIdentity:
      type: object
      description: |
        Object is used to transfer the relevant data for booting a local node to the NEM client.
        With the boot data the NEM client can create the local node object and connect to the network.

        The `private-key` is the node boot key (the key pair that identifies this node in the P2P network).
        Do not transmit this key over the network unless the request is to localhost (or another trusted IP).
        The boot endpoint is restricted to trusted IPs for this reason.
      required:
        - private-key
      properties:
        private-key:
          $ref: '#/components/schemas/PrivateKey'
          description: |
            Node boot key (private key) used to create the local node identity. Transmit only to localhost or a trusted host.
            Format: 256-bit private key encoded as a hexadecimal string (64 hex characters).
        name:
          type: string
          description: Name of the node.
    BootNodeRequest:
      type: object
      description: |
        Object is used to transfer the relevant data for booting a local node to the NEM client. 
        With the boot data the NEM client can create the local node object and connect to the network.
      required:
        - metaData
        - endpoint
        - identity
      properties:
        metaData:
          $ref: '#/components/schemas/BootNodeMetaData'
        endpoint:
          $ref: '#/components/schemas/NodeEndpoint'
        identity:
          $ref: '#/components/schemas/BootNodeIdentity'
    NodeExperience:
      type: object
      description: |
        Aggregated communication results between the local node and a remote node.
        Only successful and failed calls are tracked; the counters are only incremented and never reset in place.

        They are held in memory only and reset when the node process restarts (e.g. after a reboot).
        In addition, experience entries can be removed by periodic pruning: entries whose last update is older than 24 hours
        are dropped. After an entry is pruned, the next interaction with that peer creates a new entry starting at 0, 0.
        So for a given peer, the counts are effectively "since last restart" or "since the entry was (re)created after pruning".
      properties:
        s:
          type: integer
          format: int64
          description: Number of successful communications.
        f:
          type: integer
          format: int64
          description: Number of failed communications.
      required:
        - s
        - f
    ExtendedNodeExperiencePair:
      type: object
      description: |
        Represents a remote node together with the accumulated communication experience and synchronization statistics.
      properties:
        node:
          $ref: '#/components/schemas/Node'
        syncs:
          type: integer
          format: int32
          description: Number of synchronization attempts with the remote node.
        experience:
          $ref: '#/components/schemas/NodeExperience'
      required:
        - node
        - syncs
        - experience
    ExtendedNodeExperiencePairList:
      type: object
      description: List of extended node experience pairs.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExtendedNodeExperiencePair'
    DefaultResult:
      type: object
      description: Generic result wrapper containing type, code, and message.
      required:
        - type
        - code
        - message
      properties:
        type:
          type: integer
          format: int32
          description: Result type identifier.
        code:
          type: integer
          format: int32
          description: Result code of the operation.
        message:
          type: string
          description: Human-readable result message.
    NodeHeartbeatResult:
      allOf:
        - $ref: '#/components/schemas/DefaultResult'
        - type: object
          description: Response object for the heartbeat endpoint.
          properties:
            type:
              description: Result type. Always set to `2` (node heartbeat).
              const: 2
            code:
              description: Result code. Always set to `1` (success).
              const: 1
            message:
              description: Message. Always set to `ok`.
              const: ok
    NodeStatusResult:
      allOf:
        - $ref: '#/components/schemas/DefaultResult'
        - type: object
          description: Node status result.
          properties:
            type:
              description: Result type. Always set to `4` (node status).
              const: 4
            code:
              description: |
                Result code.
                - `2`: Node is starting.
                - `3`: Node is running.
                - `4`: Node is booting (implies RUNNING).
                - `5`: Node is booted (implies RUNNING).
                - `6`: Node is synchronized (implies RUNNING and BOOTED).
                - `7`: Node does not see any remote node (implies RUNNING and BOOTED).
                - `8`: Node is currently loading the blockchain.
            message:
              description: Message. Always set to `status`.
              const: status
    NetworkTimeStampMilliseconds:
      type: integer
      format: int64
      description: |
        Network timestamp in **milliseconds** since the NEM network epoch (29 March 2015, 00:06:25 UTC).
        Same epoch as the nemesis block; used for time synchronization request/response timestamps.
        To convert to a real date: add this value to the Unix timestamp of the NEM epoch (e.g. 1427587585000 ms for 29 March 2015 00:06:25 UTC), then use standard date functions.
      examples:
        - 344290910584
    CommunicationTimestamps:
      type: object
      description: |
        Represents network timestamps for sending and receiving a time synchronization request or response.
      required:
        - sendTimeStamp
        - receiveTimeStamp
      properties:
        sendTimeStamp:
          $ref: '#/components/schemas/NetworkTimeStampMilliseconds'
          description: |
            Network timestamp in milliseconds since the NEM network epoch (29 March 2015, 00:06:25 UTC).
            Time at the moment the reply was sent.
        receiveTimeStamp:
          $ref: '#/components/schemas/NetworkTimeStampMilliseconds'
          description: |
            Network timestamp in milliseconds since the NEM network epoch (29 March 2015, 00:06:25 UTC).
            Time at the moment the request was received.
    UnconfirmedTransactionMetaData:
      type: object
      description: |
        Metadata for an unconfirmed transaction.
        For multisig transactions this contains the hash of the inner transaction.
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/Hash'
            - type: 'null'
          description: |
            The hash of the inner transaction (multisig only), or null if the transaction is not a multisig transaction.
    UnconfirmedTransactionMetaDataPair:
      type: object
      description: |
        Pair containing an unconfirmed transaction and its associated metadata.
      required:
        - meta
        - transaction
      properties:
        meta:
          $ref: '#/components/schemas/UnconfirmedTransactionMetaData'
          description: The transaction meta data object.
        transaction:
          $ref: '#/components/schemas/Transaction'
          description: The transaction data object.
    UnconfirmedTransactionMetaDataPairList:
      type: object
      description: List of unconfirmed transaction metadata pairs.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UnconfirmedTransactionMetaDataPair'
    TransactionMetaData:
      type: object
      description: |
        Additional information about a transaction.
      required:
        - height
        - id
        - hash
      properties:
        height:
          $ref: '#/components/schemas/BlockHeight'
        id:
          type: integer
          description: Internal (database) transaction identifier.
        hash:
          $ref: '#/components/schemas/HashReference'
          description: The hash of the transaction.
        innerHash:
          type: object
          description: |
            Hash of the inner transaction in case of multisig transaction. The value is always an object, never null.
            When the transaction is multisig, the object has a `data` property with the inner transaction hash (hex string).
            When the transaction is not multisig, the object is empty `{}`.
          properties:
            data:
              $ref: '#/components/schemas/Hash'
    TransactionMetaDataPair:
      type: object
      description: |
        Pair containing a transaction and its associated metadata.
      required:
        - transaction
        - meta
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction'
          description: The transaction object.
        meta:
          $ref: '#/components/schemas/TransactionMetaData'
          description: Additional metadata about the transaction.
    TransactionMetaDataPairList:
      type: object
      description: List of transaction metadata pairs.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionMetaDataPair'
    AccountPrivateKeyTransactionsPage:
      type: object
      description: |
        Request object used to retrieve transaction data for an account with decoded messages.  
        This request requires the **private key** of the account and should only be used when the NEM client is running locally.

        Fields `hash`, `id`, and `pageSize` are optional and are used for pagination.
      required:
        - value
      properties:
        value:
          $ref: '#/components/schemas/PrivateKey'
          description: |
            256-bit private key encoded as a hexadecimal string (64 hex characters). Private key of the account;
            used to derive the account address and to decrypt messages.
        hash:
          oneOf:
            - $ref: '#/components/schemas/Hash'
            - type: 'null'
          description: |
            256-bit SHA3 hash encoded as a hexadecimal string (64 characters).
            Optional pagination cursor: when supplied, the list returns transactions that appeared **before** this transaction.
            Requires the transaction hash lookup (hash retention) feature and a hash that is still within the retention 
            window (`nis.transactionHashRetentionTime`); after that time the hash is removed from the node's cache and the request will fail. 
            Obtain this from `meta.hash` of a transaction in a previous response.
        id:
          type: string
          description: |
            Optional pagination cursor: node database identifier of the transaction. When supplied, the list returns transactions 
            that appeared **before** this transaction. Works on all nodes. Obtain this from `meta.id` of a transaction in a previous response.
          examples:
            - '100'
        pageSize:
          oneOf:
            - $ref: '#/components/schemas/PageSize'
            - type: 'null'
          description: Number of entries to return. Optional; defaults to 25. Maximum allowed value is 100.
    AnnounceRequest:
      type: object
      required:
        - data
        - signature
      properties:
        data:
          type: string
          description: |
            Hex-encoded transaction byte array. Serialize the transaction to bytes and convert to hexadecimal.
            To obtain this value, use your SDK's transaction serialization. See the announce endpoint description for more SDK links.
          pattern: ^[0-9a-fA-F]+$
        signature:
          type: string
          description: |
            Hex-encoded transaction signature. Fixed length: 64 bytes (128 hexadecimal characters). The signature is produced by signing the serialized transaction payload (the same bytes as `data` before hex encoding) with the signer's private key.
            To obtain this value, use your SDK's signing method (e.g. [JavaScript](https://www.npmjs.com/package/symbol-sdk), [Python](https://pypi.org/project/symbol-sdk-python/) - sign the transaction payload and encode the resulting 64-byte signature to hex). The signer must match the transaction's `signer` (public key) field.
          pattern: ^[0-9a-fA-F]{128}$
          minLength: 128
          maxLength: 128
    AnnounceResult:
      allOf:
        - $ref: '#/components/schemas/DefaultResult'
        - type: object
          description: Response object for transaction announcement.
          properties:
            type:
              description: Result type. Always set to `1` (validation result).
              const: 1
            code:
              description: |
                Result code (0 = NEUTRAL, 1 = SUCCESS, others = error).
                Possible result codes:
                - `0` (`NEUTRAL`): Transaction announced successfully, but already known.
                - `1` (`SUCCESS`): Transaction announced successfully.
                - `2` (`FAILURE_UNKNOWN`): Validation failed for an unknown reason.
                - `3` (`FAILURE_PAST_DEADLINE`): Validation failed because the deadline passed.
                - `4` (`FAILURE_FUTURE_DEADLINE`): Validation failed because the deadline is too far in the future. The deadline must be at most **24 hours** (1 day) after the transaction timestamp.
                - `5` (`FAILURE_INSUFFICIENT_BALANCE`): Validation failed because the account had an insufficient balance.
                - `6` (`FAILURE_MESSAGE_TOO_LARGE`): Validation failed because the message is too large.
                - `7` (`FAILURE_HASH_EXISTS`): Validation failed because the transaction hash is already known.
                - `8` (`FAILURE_SIGNATURE_NOT_VERIFIABLE`): Validation failed because the verification of the signature failed. The most common cause is that the signature was not produced by the same account as in the signer field; it can also indicate a corrupted or malformed signature, or transaction data that was modified after signing.
                - `9` (`FAILURE_TIMESTAMP_TOO_FAR_IN_PAST`): Validation failed because the time stamp is too far in the past.
                - `10` (`FAILURE_TIMESTAMP_TOO_FAR_IN_FUTURE`): Validation failed because the time stamp is too far in the future.
                - `11` (`FAILURE_INELIGIBLE_BLOCK_SIGNER`): Validation failed because the block had an ineligible signer. This usually occurs when delegated harvesting is in the process of being activated or deactivated.
                - `12` (`FAILURE_ENTITY_UNUSABLE_OUT_OF_SYNC`): Validation failed because the entity cannot be used because the nodes are out of sync. This happens frequently when a node is not fully synchronized and receives a new block with much larger height than its own chain.
                - `13` (`FAILURE_CHAIN_SCORE_INFERIOR`): Validation failed because the incoming chain's score (from the peer) is inferior to the local node's chain score; the node keeps its current chain. This result is returned during **block chain synchronization** (when the node receives a chain from a peer), not when announcing a transaction.
                - `14` (`FAILURE_CHAIN_INVALID`): Validation failed because the chain could not be validated.
                - `15` (`FAILURE_TOO_MANY_TRANSACTIONS`): Validation failed because there are too many transactions in a block.
                - `16` (`FAILURE_SELF_SIGNED_TRANSACTION`): Validation failed because a block contained a self-signed transaction.
                - `17` (`FAILURE_INSUFFICIENT_FEE`): Validation failed because a transaction has an insufficient fee.
                - `18` (`FAILURE_NEMESIS_ACCOUNT_TRANSACTION_AFTER_NEMESIS_BLOCK`): Validation failed because a transaction originated from the nemesis account after the nemesis block.
                - `19` (`FAILURE_TRANSACTION_CACHE_TOO_FULL`): Transaction was rejected because the debtor is not allowed to put another transaction into the cache. This happens when an account tries to send too many transactions in a short time. To improve the chance that the transaction gets accepted you can try to raise the transaction fee.
                - `20` (`FAILURE_WRONG_NETWORK`): Entity was rejected because it has the wrong network specified.
                - `21` (`FAILURE_CANNOT_HARVEST_FROM_BLOCKED_ACCOUNT`): Block was rejected because it was harvested by a blocked account (e.g. a reserved NEM fund).
                - `22` (`FAILURE_ENTITY_INVALID_VERSION`): Validation failed because an entity had an invalid version.
                - `41` (`FAILURE_MULTISIG_V2_AGGREGATE_MODIFICATION_BEFORE_FORK`): Validation failed because V2 multisig aggregate modification transactions are not allowed before the (first) fork height.
                - `42` (`FAILURE_TRANSACTION_BEFORE_SECOND_FORK`): Validation failed, because new transaction types (namespace, mosaic creation, mosaic supply, transfer mosaic) are not allowed before the second fork height.
                - `62` (`FAILURE_DESTINATION_ACCOUNT_IN_USE`): Validation failed because the delegated (harvesting) account is not eligible. The account must have balance zero (no XEM). It must also have no mosaics, own no namespaces, and must not be a multisig or cosignatory.
                - `63` (`FAILURE_IMPORTANCE_TRANSFER_IN_PROGRESS`): Validation failed because previous importance transfer change is in progress
                - `64` (`FAILURE_IMPORTANCE_TRANSFER_NEEDS_TO_BE_DEACTIVATED`): Validation failed because importance transfer activation was attempted while already activated.
                - `65` (`FAILURE_IMPORTANCE_TRANSFER_IS_NOT_ACTIVE`): Validation failed because importance transfer deactivation was attempted while already deactivated.
                - `66` (`FAILURE_TRANSACTION_NOT_ALLOWED_FOR_REMOTE`): Validation failed because transaction is using delegated account in an improper way.
                - `71` (`FAILURE_MULTISIG_NOT_A_COSIGNER`): Validation failed because signer is not a cosigner of given multisig account.
                - `72` (`FAILURE_MULTISIG_INVALID_COSIGNERS`): Validation failed because the cosignatories attached to a multisig transaction were invalid.
                - `73` (`FAILURE_MULTISIG_NO_MATCHING_MULTISIG`): Validation failed because a multisig signature was not associated with any known multisig transaction.
                - `74` (`FAILURE_TRANSACTION_NOT_ALLOWED_FOR_MULTISIG`): Validation failed because multisig account tried to make transaction that is not allowed. Multisig accounts are not allowed to initiate any transaction (only cosignatories are allowed to do so).
                - `75` (`FAILURE_MULTISIG_ALREADY_A_COSIGNER`): Validation failed because signer is already a cosigner of given multisig account.
                - `76` (`FAILURE_MULTISIG_MISMATCHED_SIGNATURE`): Validation failed because a multisig signature is attached to an incorrect multisig transaction.
                - `77` (`FAILURE_MULTISIG_MODIFICATION_MULTIPLE_DELETES`): Validation failed because a multisig modification contained multiple deletes. It is only allowed to remove one cosignatory at a time.
                - `78` (`FAILURE_MULTISIG_MODIFICATION_REDUNDANT_MODIFICATIONS`): Validation failed because a multisig modification contained redundant cosignatory modifications. This can happen if a transaction tries to add the same cosignatory twice.
                - `79` (`FAILURE_CONFLICTING_MULTISIG_MODIFICATION`): Validation failed because conflicting multisig modification is present. This can for instance happen if a transaction tries to add and then delete the same cosignatory.
                - `80` (`FAILURE_TOO_MANY_MULTISIG_COSIGNERS`): Validation failed because a multisig modification would result in a multisig account having too many cosigners.
                - `81` (`FAILURE_MULTISIG_ACCOUNT_CANNOT_BE_COSIGNER`): Validation failed because a multisig modification would result in a multisig account being a cosigner.
                - `82` (`FAILURE_MULTISIG_MIN_COSIGNATORIES_OUT_OF_RANGE`): Validation failed because the minimum number of cosignatories is larger than the number of cosignatories.
                - `101` (`FAILURE_MAX_CHAIN_SIZE_EXCEEDED`): Validation failed because received chain has too many blocks.
                - `102` (`FAILURE_BLOCK_UNEXPECTED_HEIGHT`): Validation failed because a block was received with an unexpected height.
                - `103` (`FAILURE_BLOCK_UNVERIFIABLE`): Validation failed because an unverifiable block was received.
                - `104` (`FAILURE_BLOCK_NOT_HIT`): Validation failed because a block was received that is not a hit.
                - `105` (`FAILURE_TRANSACTION_UNVERIFIABLE`): Validation failed because an unverifiable transaction was received.
                - `106` (`FAILURE_TRANSACTION_DUPLICATE_IN_CHAIN`): Validation failed because an incoming chain contained a transaction more than once.
                - `121` (`FAILURE_NAMESPACE_UNKNOWN`): Validation failed because the namespace is unknown.
                - `122` (`FAILURE_NAMESPACE_ALREADY_EXISTS`): Validation failed because the namespace already exists.
                - `123` (`FAILURE_NAMESPACE_EXPIRED`): Validation failed because the namespace has expired.
                - `124` (`FAILURE_NAMESPACE_OWNER_CONFLICT`): Validation failed because the transaction signer is not the owner of the namespace.
                - `125` (`FAILURE_NAMESPACE_INVALID_NAME`): Validation failed because the name for the namespace is invalid.
                - `126` (`FAILURE_NAMESPACE_INVALID_RENTAL_FEE_SINK`): Validation failed because the specified namespace rental fee sink is invalid.
                - `127` (`FAILURE_NAMESPACE_INVALID_RENTAL_FEE`): Validation failed because the specified rental fee is invalid.
                - `128` (`FAILURE_NAMESPACE_PROVISION_TOO_EARLY`): Validation failed because the provision was done too early.
                - `129` (`FAILURE_NAMESPACE_NOT_CLAIMABLE`): Validation failed because the namespace contains a reserved part and is not claimable.
                - `141` (`FAILURE_MOSAIC_UNKNOWN`): Validation failed because the mosaic is unknown.
                - `142` (`FAILURE_MOSAIC_MODIFICATION_NOT_ALLOWED`): Validation failed because the modification of the existing mosaic is not allowed.
                - `143` (`FAILURE_MOSAIC_CREATOR_CONFLICT`): Validation failed because the transaction signer is not the creator of the mosaic.
                - `144` (`FAILURE_MOSAIC_SUPPLY_IMMUTABLE`): Validation failed because the mosaic supply is immutable.
                - `145` (`FAILURE_MOSAIC_MAX_SUPPLY_EXCEEDED`): Validation failed because the maximum overall mosaic supply is exceeded.
                - `146` (`FAILURE_MOSAIC_SUPPLY_NEGATIVE`): Validation failed because the resulting mosaic supply would be negative.
                - `147` (`FAILURE_MOSAIC_NOT_TRANSFERABLE`): Validation failed because the mosaic is not transferable.
                - `148` (`FAILURE_MOSAIC_DIVISIBILITY_VIOLATED`): Validation failed because the divisibility of the mosaic is violated.
                - `149` (`FAILURE_CONFLICTING_MOSAIC_CREATION`): Validation failed because conflicting mosaic creation is present.
                - `150` (`FAILURE_MOSAIC_INVALID_CREATION_FEE_SINK`): Validation failed because the mosaic creation fee sink is invalid.
                - `151` (`FAILURE_MOSAIC_INVALID_CREATION_FEE`): Validation failed because the specified creation fee is invalid.
                - `152` (`FAILURE_TOO_MANY_MOSAIC_TRANSFERS`): Validation failed because a transfer transaction had too many attached mosaic transfers.
                - `153` (`FAILURE_MOSAIC_LEVY_NOT_TRANSFERABLE`): Validation failed because the mosaic levy is not transferable.
                - `154` (`FAILURE_MOSAIC_LEVY_UNKNOWN`): Validation failed because the mosaic levy is unknown.
            transactionHash:
              type: object
              description: |
                Hash of the announced transaction. The value is always an object, never null.
                When the announcement was successful (code 0 or 1), the object has a `data` property with the hash (hex string).
                When the hash is not available (e.g. validation failed), the object is empty `{}`.
              properties:
                data:
                  $ref: '#/components/schemas/Hash'
            innerTransactionHash:
              type: object
              description: |
                Hash of the inner transaction for multisig transactions. The value is always an object, never null.
                When the transaction is multisig and the announcement was successful, the object has a `data` property with the inner transaction hash.
                Otherwise (non-multisig or failure), the object is empty `{}`.
              properties:
                data:
                  $ref: '#/components/schemas/Hash'
            message:
              description: Validation result message.
              enum:
                - NEUTRAL
                - SUCCESS
                - FAILURE_UNKNOWN
                - FAILURE_PAST_DEADLINE
                - FAILURE_FUTURE_DEADLINE
                - FAILURE_INSUFFICIENT_BALANCE
                - FAILURE_MESSAGE_TOO_LARGE
                - FAILURE_HASH_EXISTS
                - FAILURE_SIGNATURE_NOT_VERIFIABLE
                - FAILURE_TIMESTAMP_TOO_FAR_IN_PAST
                - FAILURE_TIMESTAMP_TOO_FAR_IN_FUTURE
                - FAILURE_INELIGIBLE_BLOCK_SIGNER
                - FAILURE_ENTITY_UNUSABLE_OUT_OF_SYNC
                - FAILURE_CHAIN_SCORE_INFERIOR
                - FAILURE_CHAIN_INVALID
                - FAILURE_TOO_MANY_TRANSACTIONS
                - FAILURE_SELF_SIGNED_TRANSACTION
                - FAILURE_INSUFFICIENT_FEE
                - FAILURE_NEMESIS_ACCOUNT_TRANSACTION_AFTER_NEMESIS_BLOCK
                - FAILURE_TRANSACTION_CACHE_TOO_FULL
                - FAILURE_WRONG_NETWORK
                - FAILURE_CANNOT_HARVEST_FROM_BLOCKED_ACCOUNT
                - FAILURE_ENTITY_INVALID_VERSION
                - FAILURE_MULTISIG_V2_AGGREGATE_MODIFICATION_BEFORE_FORK
                - FAILURE_TRANSACTION_BEFORE_SECOND_FORK
                - FAILURE_DESTINATION_ACCOUNT_IN_USE
                - FAILURE_IMPORTANCE_TRANSFER_IN_PROGRESS
                - FAILURE_IMPORTANCE_TRANSFER_NEEDS_TO_BE_DEACTIVATED
                - FAILURE_IMPORTANCE_TRANSFER_IS_NOT_ACTIVE
                - FAILURE_TRANSACTION_NOT_ALLOWED_FOR_REMOTE
                - FAILURE_MULTISIG_NOT_A_COSIGNER
                - FAILURE_MULTISIG_INVALID_COSIGNERS
                - FAILURE_MULTISIG_NO_MATCHING_MULTISIG
                - FAILURE_TRANSACTION_NOT_ALLOWED_FOR_MULTISIG
                - FAILURE_MULTISIG_ALREADY_A_COSIGNER
                - FAILURE_MULTISIG_MISMATCHED_SIGNATURE
                - FAILURE_MULTISIG_MODIFICATION_MULTIPLE_DELETES
                - FAILURE_MULTISIG_MODIFICATION_REDUNDANT_MODIFICATIONS
                - FAILURE_CONFLICTING_MULTISIG_MODIFICATION
                - FAILURE_TOO_MANY_MULTISIG_COSIGNERS
                - FAILURE_MULTISIG_ACCOUNT_CANNOT_BE_COSIGNER
                - FAILURE_MULTISIG_MIN_COSIGNATORIES_OUT_OF_RANGE
                - FAILURE_MAX_CHAIN_SIZE_EXCEEDED
                - FAILURE_BLOCK_UNEXPECTED_HEIGHT
                - FAILURE_BLOCK_UNVERIFIABLE
                - FAILURE_BLOCK_NOT_HIT
                - FAILURE_TRANSACTION_UNVERIFIABLE
                - FAILURE_TRANSACTION_DUPLICATE_IN_CHAIN
                - FAILURE_NAMESPACE_UNKNOWN
                - FAILURE_NAMESPACE_ALREADY_EXISTS
                - FAILURE_NAMESPACE_EXPIRED
                - FAILURE_NAMESPACE_OWNER_CONFLICT
                - FAILURE_NAMESPACE_INVALID_NAME
                - FAILURE_NAMESPACE_INVALID_RENTAL_FEE_SINK
                - FAILURE_NAMESPACE_INVALID_RENTAL_FEE
                - FAILURE_NAMESPACE_PROVISION_TOO_EARLY
                - FAILURE_NAMESPACE_NOT_CLAIMABLE
                - FAILURE_MOSAIC_UNKNOWN
                - FAILURE_MOSAIC_MODIFICATION_NOT_ALLOWED
                - FAILURE_MOSAIC_CREATOR_CONFLICT
                - FAILURE_MOSAIC_SUPPLY_IMMUTABLE
                - FAILURE_MOSAIC_MAX_SUPPLY_EXCEEDED
                - FAILURE_MOSAIC_SUPPLY_NEGATIVE
                - FAILURE_MOSAIC_NOT_TRANSFERABLE
                - FAILURE_MOSAIC_DIVISIBILITY_VIOLATED
                - FAILURE_CONFLICTING_MOSAIC_CREATION
                - FAILURE_MOSAIC_INVALID_CREATION_FEE_SINK
                - FAILURE_MOSAIC_INVALID_CREATION_FEE
                - FAILURE_TOO_MANY_MOSAIC_TRANSFERS
                - FAILURE_MOSAIC_LEVY_NOT_TRANSFERABLE
                - FAILURE_MOSAIC_LEVY_UNKNOWN
    PrepareAnnounceRequest:
      type: object
      required:
        - transaction
        - privateKey
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction'
        privateKey:
          $ref: '#/components/schemas/PrivateKey'
          description: |
            Hex-encoded private key used by the NEM client to sign the transaction. ⚠️ **Security warning:** Send only to a trusted local node.
          examples:
            - 68e4f79f886927de698df4f857de2aada41ccca6617e56bb0d61623b35b08cc0
  responses:
    Unauthorized:
      description: |
        The request is unauthorized (HTTP 401). This can occur when a local-only endpoint is called from a remote address,
        when a harvesting-related request from remote uses a non-delegated private key, or when the private key is not in the node's allowed harvester list.
        See the examples below for typical response bodies.
      content:
        application/json:
          schema:
            description: Unauthorized response body.
            allOf:
              - $ref: '#/components/schemas/ModelError'
              - type: object
                properties:
                  error:
                    description: The value is always `Unauthorized`.
                    const: Unauthorized
                    examples:
                      - Unauthorized
                  status:
                    description: The HTTP status code of the response. Always `401`.
                    const: 401
                    examples:
                      - 401
                  message:
                    description: |
                      Detailed error message describing the failure. Examples:
                      - `remote ... attempted to call local /node/boot`: Local API was called from a remote address.
                      - `remote ... attempted to call local /account/unlock with non-remote address ...`: Start harvesting was called with a non-delegated key from a remote address.
          examples:
            localOnlyFromRemote:
              summary: Local-only endpoint called from remote
              description: The endpoint is restricted to the local machine; the request came from a non-trusted IP.
              value:
                timeStamp: 342379944
                error: Unauthorized
                message: remote 192.168.1.10 attempted to call local /account/generate
                status: 401
            nonDelegatedKeyFromRemote:
              summary: Non-delegated private key from remote
              description: Harvesting-related request from a remote address used the main account key instead of the delegated (remote harvester) key.
              value:
                timeStamp: 342379945
                error: Unauthorized
                message: remote 10.0.0.5 attempted to call local /account/unlock with non-remote address NCHESTYVD2P6P646AMY7WSNG73PCPZDUQNSD6JAK
                status: 401
            keyNotInConfiguredList:
              summary: Private key not in allowed list
              description: The node is configured with allowed harvester addresses; the supplied private key does not match any of them.
              value:
                timeStamp: 342379946
                error: Unauthorized
                message: blocking private key request with non-configured address NCHESTYVD2P6P646AMY7WSNG73PCPZDUQNSD6JAK
                status: 401
    ServerError:
      description: An internal server error occurred.
      content:
        application/json:
          schema:
            description: Internal server error response body.
            allOf:
              - $ref: '#/components/schemas/ModelError'
              - type: object
                properties:
                  error:
                    description: The value is always `Internal Server Error`.
                    const: Internal Server Error
                    examples:
                      - Internal Server Error
                  status:
                    description: The HTTP status code of the response. Always `500`.
                    const: 500
                    examples:
                      - 500
                  message:
                    description: |
                      Detailed error message describing the failure. Examples:
                      - `Request method 'GET' not supported`: The endpoint expects POST, not GET.
                      - `this node does not support historical account data retrieval`: The node does not provide historical account data.
                      - `this node does not support transaction hash lookup`: The node does not support transaction lookup by hash.
          examples:
            internalServerError:
              summary: Internal server error
              description: The node does not support retrieval of historical account data.
              value:
                timeStamp: 342379020
                error: Internal Server Error
                message: this node does not support historical account data retrieval
                status: 500
    ServiceUnavailable:
      description: The service is temporarily unavailable.
      content:
        application/json:
          schema:
            description: Service unavailable response body.
            allOf:
              - $ref: '#/components/schemas/ModelError'
              - type: object
                properties:
                  error:
                    description: The value is always `Service Unavailable`.
                    const: Service Unavailable
                    examples:
                      - Service Unavailable
                  status:
                    description: The HTTP status code of the response. Always `503`.
                    const: 503
                    examples:
                      - 503
                  message:
                    description: |
                      Detailed error message describing the failure. Examples:
                      - `NIS_ILLEGAL_STATE_LOADING_CHAIN`: NEM client is loading the blockchain.
                      - `NIS_ILLEGAL_STATE_NOT_BOOTED`: NEM client is not booted.
                      - `NIS_ILLEGAL_STATE_ALREADY_BOOTED`: NEM client has already been booted.
          examples:
            serviceUnavailable:
              summary: Service is temporarily unavailable
              description: The node is currently loading the blockchain and cannot process requests.
              value:
                timeStamp: 342377277
                error: Service Unavailable
                message: NIS_ILLEGAL_STATE_LOADING_CHAIN
                status: 503
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            description: Bad request response body.
            allOf:
              - $ref: '#/components/schemas/ModelError'
              - type: object
                properties:
                  error:
                    description: The value is always `Bad Request`.
                    const: Bad Request
                    examples:
                      - Bad Request
                  status:
                    description: The HTTP status code of the response. Always `400`.
                    const: 400
                    examples:
                      - 400
                  message:
                    description: |
                      The detailed error message. Example errors:
                      - `address must be valid`: One or more addresses provided in the request are invalid.
                        All addresses are validated prior to processing.
                      - `JSON Object was expected`: A required parameter is missing or the request body is not valid JSON.
                      - `height must be positive`: The supplied block height is zero or negative. Block height values must be greater than zero.
                      - `'11źż' is not a valid namespace id part`: The provided namespace identifier contains invalid characters
                        or does not conform to the required format.
                      - `FAILURE_UNKNOWN_ACCOUNT`: Harvesting could not be started for account because it is unknown.
                      - `FAILURE_HARVESTING_INELIGIBLE`: Harvesting could not be started for account because it is ineligible for harvesting.
                      - `FAILURE_HARVESTING_BLOCKED`: Harvesting could not be started for account because it is blocked from harvesting.
                      - `FAILURE_SERVER_LIMIT`: Harvesting could not be started for account because the server limit has been hit.
          examples:
            invalidAddress:
              summary: Invalid address
              description: The provided address is not valid.
              value:
                timeStamp: 342378866
                error: Bad Request
                message: address must be valid
                status: 400
            invalidPublicKey:
              summary: Invalid public key format
              description: The provided public key is not in compressed form.
              value:
                timeStamp: 342378753
                error: Bad Request
                message: publicKey must be in compressed form
                status: 400
    ResourceNotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            description: Resource not found response body.
            allOf:
              - $ref: '#/components/schemas/ModelError'
              - type: object
                properties:
                  error:
                    description: The value is always `Not Found`.
                    const: Not Found
                    examples:
                      - Not Found
                  status:
                    description: The HTTP status code of the response. Always `404`.
                    const: 404
                    examples:
                      - 404
                  message:
                    description: |
                      Detailed error message describing the failure. Examples:
                      - `transaction not found in the db`: The requested transaction was not found.
                      - `block not found in the db`: The requested block was not found.
          examples:
            resourceNotFound:
              summary: Resource not found
              description: The requested resource does not exist or could not be found in the database.
              value:
                timeStamp: 342380122
                error: Not Found
                message: block not found in the db '50111111' (org.nem.core.model.Block)
                status: 404
  parameters:
    address:
      name: address
      in: query
      required: true
      description: The account address.
      schema:
        $ref: '#/components/schemas/Address'
      examples:
        default:
          summary: Testnet address
          value: TALICELCD3XPH4FFI5STGGNSNSWPOTG5E4DS2TOS
        mainnet:
          summary: Mainnet address
          value: NCHESTYVD2P6P646AMY7WSNG73PCPZDUQNSD6JAK
    publicKey:
      name: publicKey
      in: query
      required: true
      description: Account public key (hex-encoded).
      schema:
        $ref: '#/components/schemas/PublicKey'
      examples:
        default:
          value: a11a1a6c17a24252e674d151713cdf51991ad101751e4af02a20c61b59f1fe1a
    startHeight:
      name: startHeight
      in: query
      required: true
      description: Block height from which to return data.
      schema:
        $ref: '#/components/schemas/BlockHeight'
      examples:
        default:
          value: 17590
    endHeight:
      name: endHeight
      in: query
      required: true
      description: |
        Block height up to which to return data (inclusive).
        Must be greater than or equal to the start height.
      schema:
        $ref: '#/components/schemas/BlockHeight'
      examples:
        default:
          value: 17592
    increment:
      name: increment
      in: query
      required: true
      description: |
        Step between consecutive block heights. Must be greater than 0.
        Each returned data point is a snapshot of the account state at that specific block height;
        blocks between sampled heights are simply skipped.
      schema:
        type: integer
        format: int32
        minimum: 1
      examples:
        default:
          value: 1
    addressFilter:
      name: address
      in: query
      required: true
      description: |
        Filter by address. An address is involved when the account is the sender or recipient of the transaction.
      schema:
        $ref: '#/components/schemas/Address'
      examples:
        default:
          summary: Testnet address
          value: TALICELCD3XPH4FFI5STGGNSNSWPOTG5E4DS2TOS
        mainnet:
          summary: Mainnet address
          value: NCHESTYVD2P6P646AMY7WSNG73PCPZDUQNSD6JAK
    id:
      name: id
      in: query
      description: |
        The node database identifier of the object (e.g., block, transaction, namespace) used for pagination.
        When supplied, the request returns objects that appeared directly before the object with this identifier,
        in the order defined by the request criteria.

        For account transaction list endpoints, this is the value from `meta.id` of a transaction in a previous response.
      schema:
        $ref: '#/components/schemas/DatabaseId'
      examples:
        default:
          value: 5646403
    pageSize:
      name: pageSize
      in: query
      description: Number of entries to return.
      schema:
        $ref: '#/components/schemas/PageSize'
      examples:
        default:
          value: 25
    mosaicId:
      name: mosaicId
      in: query
      required: true
      description: Mosaic identifier.
      schema:
        type: string
      examples:
        default:
          value: nem:xem
    namespace:
      name: namespace
      in: query
      required: true
      description: Fully-qualified namespace identifier (e.g. `makoto.metal.coins`).
      schema:
        $ref: '#/components/schemas/NamespaceId'
      examples:
        default:
          value: makoto.metal.coins
    parentNamespace:
      name: parent
      in: query
      description: Parent namespace identifier.
      schema:
        $ref: '#/components/schemas/NamespaceId'
      examples:
        default:
          value: makoto.metal
    height:
      name: height
      in: query
      description: Block height at which the data is queried.
      schema:
        $ref: '#/components/schemas/BlockHeight'
      examples:
        default:
          value: 17592
    hashFilter:
      name: hash
      in: query
      description: |
        The 256-bit SHA3 hash (64 hexadecimal characters) of the transaction used as pagination cursor.
        When supplied, the request returns transactions that appeared directly before this transaction,
        in the order defined by the request criteria.

        Requires the transaction hash lookup (hash retention) feature and a hash that is still within the retention window (`nis.transactionHashRetentionTime`). 
        Even when the feature is enabled, hashes older than this window are removed from the node's cache and will cause the request to fail. 
        Obtain this from `meta.hash` of a transaction in a previous list response. For reliable pagination on any node, prefer using the `id` parameter instead.
      schema:
        $ref: '#/components/schemas/Hash'
      examples:
        default:
          value: 81d52a7df4abba8bb1613bcc42b6b93cf3114524939035d88ae8e864cd2c34c8
    hash:
      name: hash
      in: query
      required: true
      description: |
        The 256-bit SHA3 hash of the transaction (64 hexadecimal characters).
      schema:
        $ref: '#/components/schemas/Hash'
      examples:
        default:
          value: 81d52a7df4abba8bb1613bcc42b6b93cf3114524939035d88ae8e864cd2c34c8
  requestBodies:
    accounts:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/accounts'
          examples:
            default:
              summary: Mainnet accounts (batch)
              value:
                data:
                  - account: NCHESTYVD2P6P646AMY7WSNG73PCPZDUQNSD6JAK
                  - account: NDEE6PQL2OTX7BSE7PKQ55IQXXFJHPAH7QVBOJMP
      required: true
    blockHeight:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BlockReference'
          examples:
            default:
              summary: Block height for request
              value:
                height: 17592
      required: true
    privateKey:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/privateKey'
      required: true
