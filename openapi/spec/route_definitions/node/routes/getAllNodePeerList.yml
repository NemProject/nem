tags:
  - Node
summary: Return all known nodes in neighborhood
description: |
  Gets a collection of all nodes currently known by the running node, grouped by their connection status.
  
  The response contains arrays of nodes categorized by status:
    - **active** – node is reachable and responsive
    - **busy** – node is reachable but does not respond within timeout
    - **inactive** – node is unreachable
    - **failure** – node failed authentication or encountered a fatal error
operationId: getAllNodePeerList
responses:
  '200':
    description: Successfully retrieved node neighborhood.
    content:
      application/json:
        schema:
          $ref: "../schemas/NodeCollection.yml"
  '400':
    $ref: "../../../responses/BadRequest.yml"
  '500':
    $ref: "../../../responses/ServerError.yml"
  '503':
    $ref: "../../../responses/ServiceUnavailable.yml"