tags:
  - Mosaic
summary: Return mosaic definitions created by account (paged)
description: |
  Returns mosaic definitions created by a specific account.
  Results can be optionally filtered by a parent namespace and retrieved in pages using a cursor-based pagination mechanism.
operationId: getAccountMosaicDefinitionPage
parameters:
  - $ref: "../../../parameters/query/address.yml"
  - $ref: "../../../parameters/query/parentNamespace.yml"
  - $ref: "../../../parameters/query/id.yml"
  - $ref: "../../../parameters/query/pageSize.yml"
responses:
  '200':
    description: Mosaic definitions successfully retrieved.
    content:
      application/json:
        schema:
          type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: "../../transaction/schemas/MosaicDefinition.yml"
  '400':
    $ref: "../../../responses/BadRequest.yml"
  '404':
    $ref: "../../../responses/ResourceNotFound.yml"
  '500':
    $ref: "../../../responses/ServerError.yml"
  '503':
    $ref: "../../../responses/ServiceUnavailable.yml"