tags:
  - Time synchronization
summary: Return network communication timestamps
description: |
  Returns the network timestamps representing when a time synchronization request or response was sent and received.

  Both timestamps are expressed as network time in milliseconds.
operationId: getNetworkTime
responses:
  '200':
    description: Network communication timestamps successfully returned.
    content:
      application/json:
        schema:
          $ref: "../schemas/CommunicationTimestamps.yml"
  '400':
    $ref: "../../../responses/BadRequest.yml"
  '500':
    $ref: "../../../responses/ServerError.yml"
  '503':
    $ref: "../../../responses/ServiceUnavailable.yml"
