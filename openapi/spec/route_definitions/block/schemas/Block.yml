type: object
description: >
  A block is the structure that contains transaction information.
  Blocks are generated and signed by accounts.
  
  A regular block can contain up to 120 transactions.
  The nemesis block is not subject to the 120-transaction limit.
required:
  - timeStamp
  - signature
  - prevBlockHash
  - type
  - transactions
  - version
  - signer
  - height
properties:
  timeStamp:
    $ref: "../../../schemas/TimeStamp.yml"
    description: Number of seconds elapsed since the creation of the nemesis block.
  signature:
    type: string
    description: Signature of the block generated by the signer. Used to validate block integrity.
  prevBlockHash:
    $ref: "../../../schemas/HashReference.yml"
    description: SHA3-256 hash of the previous block.
  type:
    type: integer
    description: |
      The block type. There are currently two block types used:
      - -1: Nemesis block
      - 1: Regular block
    enum:
      - -1
      - 1
  transactions:
    type: array
    description: |
      Array of transactions included in the block. Maximum of 120 transactions.
    maxItems: 120
    items:
      $ref: "../../transaction/schemas/Transaction.yml"
  version:
    type: integer
    format: int32
    description: |
      Block version. Supported values:
      - 1744830465 (main network)
      - 1610612737 (mijin network)
      - -1744830463 (test network)
  signer:
    $ref: "../../../schemas/PublicKey.yml"
    description: Public key of the harvester of the block as a hexadecimal string.
  height:
    $ref: "../../../schemas/BlockHeight.yml"
    description: Height of the block in the blockchain. Each subsequent block increases the height by 1.
