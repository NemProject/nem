name: hash
in: query
description: |
  The 256-bit SHA3 hash (64 hexadecimal characters) of the transaction used as pagination cursor.
  When supplied, the request returns transactions that appeared directly before this transaction,
  in the order defined by the request criteria.
schema:
  $ref: "../../schemas/Hash.yml"
examples:
  default:
    value: "81d52a7df4abba8bb1613bcc42b6b93cf3114524939035d88ae8e864cd2c34c8"
